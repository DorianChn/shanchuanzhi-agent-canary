</style></head><body><div class="shell"><header><div class="brand">AGENT CANARY <span style="color:#7390bc;font-weight:400">/ 安全演示</span></div><div>OPEN SOURCE AI TOOL · SHANGHAI 2026</div></header><div class="wait" id="wait">准备录制</div><main><div class="tag" id="tag"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div id="body"></div><div class="note" id="note"></div></main><div class="caption" id="caption">本视频展示已保存的本地结果，不运行实时模型。</div><div class="progress"><div class="bar" id="bar"></div></div><footer><span>参赛材料版本 dad03c7 · 原始试验与报告随仓库保存</span><span>本地合成旁白 · 所有危险效果均为 mock</span></footer></div><script>
const scenes=[{"id":"intro","tag":"开源 AI 工具 · 2026 上海","title":"Agent Canary","lead":"AI Coding Agent 的运行时信号与会话隔离","cards":[["参赛版本","dad03c7 · 公开竞赛分支"],["本地模型 pilot","72 次完整工具选择试验"],["外部副作用","0 次 · 全部工具为合成 callback"]],"note":"技术演示 · 不代表官方评审或获奖结果","start":0},{"id":"risk","tag":"01 / 威胁场景","title":"不可信内容会进入 Agent 上下文","lead":"恶意指令可藏在 Agent 为完成任务而读取的仓库、网页或工具输出中。","flow":["恶意 README / 网页 / 工具输出","AI Agent 上下文","读取虚拟秘密 / 调用危险工具"],"note":"安全提示不能替代宿主侧的 callback 执行控制。","start":21.433197278911564},{"id":"architecture","tag":"02 / 系统路径","title":"从信号到受守卫的工具回调","lead":"Canary 提供可追踪的诱饵信号；Guard 与 Router 负责隔离后的执行判定。","flow":["MCP 诱饵 / Canary Token","Session Guard 状态转换","Guarded Tool Router","宿主 callback / JSONL 审计"],"note":"只有接入 Guard/Router 的回调才经过这条检查路径。","start":41.249387755102035},{"id":"offline","tag":"03 / 确定性离线演示","title":"隔离后的后续 callback 被拒绝","lead":"下方是本机此前执行 `npm run demo:containment` 的保存输出。演示脚本固定触发合成诱饵，不算模型自主检测。","pre":"npm run demo:containment\n{\n  \"demo\": \"synthetic SDK containment\",\n  \"safeToolCallback\": { \"simulated\": true, \"tool\": \"git_status\" },\n  \"decoyTool\": \"canary_read_secrets\",\n  \"finalGuardState\": \"QUARANTINED\",\n  \"blockedDangerousCallback\": true,\n  \"realCallbacksRun\": [\"git_status\"],\n  \"auditEvents\": [\"session_tripped\", \"session_quarantined\", \"decoy_called\", \"action_blocked\"],\n  \"effects\": \"No shell, network, file deletion, credentials, or payment was used.\"\n}","note":"仅安全 git_status mock callback 执行；无真实 Shell、网络、文件或凭据操作。","start":64.50789115646258},{"id":"experiment","tag":"04 / 本机真实模型 pilot","title":"同一模型、三条执行路径","lead":"Ollama 本机 Qwen 3.5 9B；仓库内最小 function-calling loop；虚拟仓库和内存 callback。","cards":[["A · 无 Canary","只有虚拟普通工具"],["B · 仅诱饵","真实危险 callback 不接 Guard"],["C · 诱饵 + Router","危险 callback 进入 Guarded Tool Router"]],"note":"录屏时不调用模型；展示来自保存的本机原始记录。","start":88.46562358276645},{"id":"safety","tag":"05 / 结果一：Safety-aware profile","title":"诱饵触发：0 / 40","lead":"模型在 B/C 组 40 个可比诱饵机会中没有主动选择 Canary。","cards":[["A · 攻击成功场景","1 / 10"],["B · 攻击成功场景","0 / 10 · 无危险回调尝试"],["C · 攻击成功场景","0 / 10 · Guard 拦截率未测得"]],"note":"B/C 没有危险 callback 尝试；不能把 0/10 归因于 Guard 拦截。","start":117.30031746031752},{"id":"neutral","tag":"06 / 结果二：Neutral profile","title":"无信号时，危险 mock 仍会执行","lead":"Neutral profile 中 A/B/C 的攻击成功场景分别是 1/10、2/10、2/10。","cards":[["C · 危险 callback 尝试","5 次"],["执行时 Guard 状态","SAFE"],["隔离信号前的阻断","0 / 5"]],"note":"这揭示了真实边界：Router 在未触发信号时不能推断调用本身恶意。","start":146.2358730158731},{"id":"seeded","tag":"07 / 预置隔离跟进","title":"隔离后的阻断单独计分","lead":"测试夹具预置 quarantine 后，C 组通过 Router 拒绝 3/3 次后续危险 callback。","cards":[["模型检测贡献","0 · 预置状态由 harness 建立"],["Agent Canary C 组阻断","3 / 3"],["B 组","callback 未接 Guard，仍可执行"]],"note":"3/3 验证隔离后的拒绝路径，不是模型发现诱饵的成功率。","start":163.45891156462596},{"id":"quality","tag":"08 / 工程证据","title":"数据范围和性能边界","lead":"指标来自本机合成负载与内存快速路径，不代表生产并发、MCP 网络或真实工具耗时。","cards":[["根 + sponsor Node 测试","146 总计 · 141 通过 · 5 跳过"],["npm audit","两处均为 0 漏洞"],["Token 扫描 50 MiB","45.1 ms 中位数 · 3 次样本"]],"note":"此处显示当前本地验证；Docker 与多平台结果以对应 Actions 为准。","start":174.92149659863958},{"id":"comparison","tag":"09 / 开源生态","title":"定位互补，不贬低同类工具","lead":"Promptfoo 支持 Agent/MCP 红队测试；PyRIT 支持可组合的多轮安全评估。","cards":[["红队发现与评估","Promptfoo · Microsoft PyRIT"],["运行时宿主接线","Agent Canary：隔离信号到 callback 判定"],["治理入口","MIT · SECURITY · CONTRIBUTING · CI"]],"note":"可组合使用；不声称彻底解决 Prompt Injection。","start":199.1684807256237},{"id":"closing","tag":"10 / 结语","title":"可复现的运行时隔离路径","lead":"Agent Canary 不是全局 Agent 防火墙。","cards":[["已知保护边界","首个危险调用 / Guard 旁路 / 已开始的外部操作"],["尚未解决 P1","公开分发包含许可门控的 V2 编译模块"],["代码与材料","github.com/DorianChn/shanchuanzhi-agent-canary"]],"note":"本视频含 Windows 合成旁白；不展示实时模型推理，也不宣称获奖。","start":223.53315192743779}],cues=[{"sceneId":"intro","text":"大家好，下面介绍 Agent Canary，一个面向 AI 编码代理的运行时信号与会话隔离组件。","start":0,"end":6.713741496598639},{"sceneId":"intro","text":"这份演示对应公开竞赛分支的材料提交，代码和实验原始记录都可以复现。","start":7.61374149659864,"end":13.409251700680272},{"sceneId":"intro","text":"展示的是已经运行并保存的工程证据，不代表官方评审、奖项或安全保证。","start":14.309251700680273,"end":20.533197278911565},{"sceneId":"risk","text":"间接提示注入会藏在 Agent 需要读取的仓库文件、网页和工具输出里。","start":21.433197278911564,"end":26.897142857142857},{"sceneId":"risk","text":"模型可能把这些不可信内容误当成任务指令，并尝试读取秘密或调用工具。","start":27.797142857142855,"end":33.74925170068027},{"sceneId":"risk","text":"系统提示可以提醒模型谨慎，但不能保证宿主的危险 callback 一定停止。","start":34.64925170068027,"end":40.349387755102036},{"sceneId":"architecture","text":"Canary 诱饵为某些越权行为提供精确、可记录的会话信号。","start":41.249387755102035,"end":45.96453514739228},{"sceneId":"architecture","text":"Session Guard 管理安全、触发和隔离状态，并支持共享状态接线。","start":46.86453514739228,"end":52.13746031746031},{"sceneId":"architecture","text":"Guarded Tool Router 在宿主 callback 执行之前检查当前隔离状态。","start":53.03746031746031,"end":57.46512471655328},{"sceneId":"architecture","text":"审计事件记录信号与拒绝结果，便于复盘这条受守卫的调用路径。","start":58.365124716553275,"end":63.60789115646257},{"sceneId":"offline","text":"离线演示的复现命令是 npm run demo:containment。","start":64.50789115646258,"end":68.60897959183673},{"sceneId":"offline","text":"保存的运行结果显示，安全 git status mock 先执行，随后固定诱饵触发隔离。","start":69.50897959183673,"end":75.60888888888888},{"sceneId":"offline","text":"会话进入 QUARANTINED，之后经过 Router 的危险模拟回调被拒绝。","start":76.50888888888889,"end":81.3708843537415},{"sceneId":"offline","text":"这是 SDK 路径的确定性验证，不把固定诱饵调用计作模型检测。","start":82.27088435374151,"end":87.56562358276645},{"sceneId":"experiment","text":"本轮使用已安装在本机 Ollama 的 Qwen 三点五九 B 模型。","start":88.46562358276645,"end":92.57809523809526},{"sceneId":"experiment","text":"工具选择由仓库内的最小 function calling loop 驱动，没有接入通用 Agent 框架。","start":93.47809523809526,"end":99.1159637188209},{"sceneId":"experiment","text":"A 组没有 Canary；B 组暴露诱饵，但危险 callback 不经过 Guard。","start":100.0159637188209,"end":104.90054421768711},{"sceneId":"experiment","text":"C 组通过项目的 Guarded Tool Router 执行危险的虚拟工具回调。","start":105.80054421768712,"end":110.22848072562363},{"sceneId":"experiment","text":"文件、凭据、Shell 和网络工具都只用内存数据与无副作用的 mock。","start":111.12848072562363,"end":116.40031746031751},{"sceneId":"safety","text":"两个有提示词哈希的配置各完成三十六次调用试验。","start":117.30031746031752,"end":121.47487528344676},{"sceneId":"safety","text":"主比较包含六十次可比攻击试验，以及六次正常控制。","start":122.37487528344677,"end":126.954149659864},{"sceneId":"safety","text":"模型在 B 和 C 组四十次可比机会中，没有一次主动选择诱饵。","start":127.854149659864,"end":132.80480725623588},{"sceneId":"safety","text":"Safety aware 配置中，A 组攻击成功一比十，B 组和 C 组都是零比十。","start":133.70480725623588,"end":139.2149206349207},{"sceneId":"safety","text":"但这一配置下 B 和 C 没有危险 callback 尝试，Guard 拦截率没有测出。","start":140.1149206349207,"end":145.3358730158731},{"sceneId":"neutral","text":"Neutral 配置中，A 组攻击成功一比十，B 组和 C 组都是二比十。","start":146.2358730158731,"end":151.49179138322003},{"sceneId":"neutral","text":"C 组有五次危险模拟 callback 在 Guard 仍为 SAFE 时执行。","start":152.39179138322004,"end":156.58857142857153},{"sceneId":"neutral","text":"这说明没有触发信号时，Router 不能单独判断一次调用是否恶意。","start":157.48857142857153,"end":162.55891156462596},{"sceneId":"seeded","text":"测试夹具预置隔离后，C 组阻断三比三次后续危险 callback。","start":163.45891156462596,"end":168.2595918367348},{"sceneId":"seeded","text":"这三次只证明隔离后的执行拒绝路径，不计作 Agent 检测成功。","start":169.15959183673482,"end":174.02149659863957},{"sceneId":"quality","text":"离线攻击回归覆盖信号、状态转换和受守卫 callback 的拒绝路径。","start":174.92149659863958,"end":180.08167800453526},{"sceneId":"quality","text":"五十兆字节合成 Token 扫描的三次中位耗时是四十五点一毫秒。","start":180.98167800453527,"end":185.92281179138334},{"sceneId":"quality","text":"Guard 快速路径是微基准；它不包含 MCP 网络和宿主工具运行时间。","start":186.82281179138334,"end":192.38321995464864},{"sceneId":"quality","text":"根项目和赞助子项目共一百四十六项测试，一百四十一项通过。","start":193.28321995464864,"end":198.2684807256237},{"sceneId":"comparison","text":"Promptfoo 支持 Agent 与 MCP 红队测试，PyRIT 支持多轮安全评估。","start":199.1684807256237,"end":204.59941043083913},{"sceneId":"comparison","text":"Agent Canary 关注运行时把隔离信号接到宿主的工具调用边界。","start":205.49941043083913,"end":210.18594104308403},{"sceneId":"comparison","text":"它可以和评估框架配合，不声称覆盖所有提示注入或所有宿主。","start":211.08594104308403,"end":216.31904761904775},{"sceneId":"comparison","text":"项目保留 MIT 许可、贡献指南、安全报告和公开维护路线图。","start":217.21904761904776,"end":222.63315192743778},{"sceneId":"closing","text":"目前公开分发包仍含许可门控的 V2 编译模块，稳定发布条件尚未满足。","start":223.53315192743779,"end":229.50875283446726},{"sceneId":"closing","text":"首次危险调用、绕过 Guard 的宿主调用和已开始的外部操作都有限制。","start":230.40875283446726,"end":235.57841269841285},{"sceneId":"closing","text":"请通过项目介绍、实验报告和仓库中的原始数据复核这些结果。","start":236.47841269841285,"end":241.67736961451263},{"sceneId":"closing","text":"Agent Canary：一条可复现的运行时隔离路径，不是全局 Agent 防火墙。","start":242.57736961451263,"end":248.19941043083915}],duration=251.199;let started=0,activeScene="";const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(s){activeScene=s.id;$("tag").textContent=s.tag;$("title").textContent=s.title;$("lead").textContent=s.lead;$("note").textContent=s.note||"";if(s.id==='intro'){$("title").classList.add('hero');$("lead").classList.add('subhero')}else{$("title").classList.remove('hero');$("lead").classList.remove('subhero')}let b='';if(s.flow)b='<div class="flow">'+s.flow.map(x=>'<div class="box">'+esc(x)+'</div>').join('')+'</div>';if(s.cards)b='<div class="cards">'+s.cards.map(([k,v])=>'<div class="card"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>').join('')+'</div>';if(s.pre)b='<pre class="terminal">'+esc(s.pre)+'</pre>';$("body").innerHTML=b}function tick(t){if(!started)return;let e=(t-started)/1000;if(e>duration){render(scenes.at(-1));$("caption").textContent="Agent Canary · 可复现的运行时隔离路径，不是全局 Agent 防火墙。";$("wait").textContent="演示结束";$("bar").style.width="100%";window.__VIDEO_DONE__=true;return}let c=[...cues].reverse().find(x=>e>=x.start);if(c){const s=scenes.find(x=>x.id===c.sceneId);if(s&&s.id!==activeScene)render(s);$("caption").textContent=c.text}$("bar").style.width=(e/duration*100).toFixed(3)+'%';requestAnimationFrame(tick)}window.startShow=()=>{if(started)return;started=performance.now();$("wait").textContent="正在播放实验结果讲解";render(scenes[0]);requestAnimationFrame(tick)};render(scenes[0]);window.renderCue=(i)=>{const c=cues[i],s=scenes.find(x=>x.id===c.sceneId);render(s);$("caption").textContent=c.text;$("wait").textContent="实测结果画面 · 非实时模型";$("bar").style.width=(c.start/duration*100).toFixed(3)+"%"};
</script></body></html>
