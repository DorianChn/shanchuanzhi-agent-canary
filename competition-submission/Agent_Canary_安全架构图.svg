<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#55d6be"/></marker></defs><rect width="1280" height="570" fill="#0b1528"/><g fill="#e8edf7" font-family="Microsoft YaHei, sans-serif"><text x="55" y="62" font-size="30">Agent Canary · 受保护工具的分层执行边界</text><rect x="55" y="118" width="255" height="98" rx="12" fill="#172238" stroke="#37516b"/><text x="73" y="156" font-size="21">不可信输入 / 宿主 Agent</text><text x="73" y="188" font-size="15" fill="#adc0d4">真实模型读取文本与自主选工具</text><rect x="355" y="118" width="255" height="98" rx="12" fill="#172238" stroke="#37516b"/><text x="373" y="156" font-size="21">确定性参数策略</text><text x="373" y="188" font-size="15" fill="#adc0d4">可信描述、敏感历史、一次批准</text><rect x="655" y="118" width="255" height="98" rx="12" fill="#172238" stroke="#37516b"/><text x="673" y="156" font-size="21">Guard 最终检查</text><text x="673" y="188" font-size="15" fill="#adc0d4">隔离不受 AI 建议撤销</text><rect x="955" y="118" width="260" height="98" rx="12" fill="#172238" stroke="#37516b"/><text x="973" y="156" font-size="21">宿主 callback</text><text x="973" y="188" font-size="15" fill="#adc0d4">真实权限边界由宿主实现</text><rect x="80" y="310" width="280" height="98" rx="12" fill="#172238" stroke="#37516b"/><text x="98" y="348" font-size="21">MCP 诱饵 / Canary Token</text><text x="98" y="380" font-size="15" fill="#adc0d4">同步隔离，不等待执行队列</text><rect x="485" y="310" width="280" height="98" rx="12" fill="#172238" stroke="#37516b"/><text x="503" y="348" font-size="21">脱敏审计日志</text><text x="503" y="380" font-size="15" fill="#adc0d4">记录实际原因和状态</text><rect x="885" y="310" width="300" height="98" rx="12" fill="#172238" stroke="#37516b"/><text x="903" y="348" font-size="21">事后 AI 分析</text><text x="903" y="380" font-size="15" fill="#adc0d4">仅解释；不批准、不 Reset</text><path d="M310 167L353 167" stroke="#55d6be" stroke-width="3" marker-end="url(#a)"/><path d="M610 167L653 167" stroke="#55d6be" stroke-width="3" marker-end="url(#a)"/><path d="M910 167L953 167" stroke="#55d6be" stroke-width="3" marker-end="url(#a)"/><path d="M360 345L650 204" stroke="#55d6be" stroke-width="3" marker-end="url(#a)"/><path d="M780 220L640 303" stroke="#55d6be" stroke-width="3" marker-end="url(#a)"/><path d="M765 360L880 360" stroke="#55d6be" stroke-width="3" marker-end="url(#a)"/><text x="55" y="485" font-size="20" fill="#adc0d4">AI 失败不放权；首次调用由注册策略检查；已开始的外部效果不可撤回。</text><text x="55" y="525" font-size="18" fill="#adc0d4">绕过 Router、新主体历史、真实 symlink / 进程 / DNS 沙箱均需宿主覆盖。</text></g></svg>
