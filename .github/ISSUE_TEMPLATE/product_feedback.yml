name: Product feedback
description: Share a setup or usability experience
title: "feedback: "
body:
  - type: markdown
    attributes:
      value: |
        This feedback is public. Use a pseudonym or omit identity. Do not include secrets, private project files, employer/customer data, or exploit details. Use a private Security Advisory for vulnerabilities.
  - type: dropdown
    id: experience
    attributes:
      label: Your software-development experience
      options:
        - I do not work as a software developer
        - I am learning to code
        - I work with software but do not develop it
        - Prefer not to say
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Version/tag or full commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and host (optional)
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What worked or got in the way?
      description: Include confusing wording or the step where you stopped.
    validations:
      required: true
  - type: dropdown
    id: outcome_status
    attributes:
      label: Outcome
      options:
        - Completed without help
        - Completed after clarification
        - Could not complete
        - I stopped for safety
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials and private/customer data from this report.
          required: true
        - label: Maintainers may quote an anonymized excerpt from this public report.
          required: false
