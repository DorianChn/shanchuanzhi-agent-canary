name: Bug report
description: Report a reproducible Agent Canary problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue. Do not include credentials, customer data, private logs, payment records, or exploit details. Use synthetic values and redact usernames and local paths. Report vulnerabilities privately through the Security tab.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest steps using a disposable project and synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release/tag or full commit SHA
      placeholder: "For example: v1.2.7 or full SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Node.js, and host/version
    validations:
      required: true
  - type: textarea
    id: effects
    attributes:
      label: Observed effect
      description: If relevant, include redacted callback counts or before/after hashes; a DENY label alone is not side-effect evidence.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Remove credentials, personal paths, private URLs, and customer identifiers before posting.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed secrets and personal/customer data.
          required: true
        - label: I tested only systems I own or am authorized to use.
          required: true
