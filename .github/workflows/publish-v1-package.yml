name: Publish public V1 package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@dorianchn'
      - name: Validate public V1 package
        shell: bash
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          if (pkg.name !== '@dorianchn/agent-canary') throw new Error(`unexpected package name: ${pkg.name}`);
          if (!/^1\./.test(pkg.version)) throw new Error(`refusing to publish non-V1 version: ${pkg.version}`);
          if (pkg.publishConfig?.registry !== 'https://npm.pkg.github.com') throw new Error('unexpected package registry');
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
      - name: Publish V1 to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
