name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check registry version tag
        id: registry-version
        shell: bash
        run: |
          version=$(node -p "require('./server.json').version")
          if [[ "${GITHUB_REF_NAME}" == "v${version}" || ("${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF_NAME}" == "main") ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping registry publish: ${GITHUB_REF_NAME} is not the server version tag v${version}."
          fi

      - name: Install mcp-publisher
        if: steps.registry-version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          version=v1.8.1
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/download/${version}/${archive}" \
            --output "${archive}"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" mcp-publisher
          rm -f "${archive}"

      - name: Authenticate to MCP Registry (OIDC)
        if: steps.registry-version.outputs.publish == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: steps.registry-version.outputs.publish == 'true'
        run: ./mcp-publisher publish
