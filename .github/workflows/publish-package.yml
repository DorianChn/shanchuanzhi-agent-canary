name: Publish public Agent Canary 2.x package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@dorianchn'
      - name: Validate free public 2.x package
        shell: bash
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          if (pkg.name !== '@dorianchn/agent-canary') throw new Error(`unexpected package name: ${pkg.name}`);
          if (!/^2\./.test(pkg.version)) throw new Error(`refusing to publish a version outside the free 2.x line: ${pkg.version}`);
          if (pkg.publishConfig?.registry !== 'https://npm.pkg.github.com') throw new Error('unexpected package registry');
          NODE
      - name: Require the GitHub package to be public before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          visibility="$(gh api '/user/packages/npm/%40dorianchn%2Fagent-canary' --jq '.visibility' 2>/dev/null || true)"
          if [[ "$visibility" != "public" ]]; then
            echo 'Refusing to publish: configure @dorianchn/agent-canary as Public in GitHub Packages settings first.' >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
