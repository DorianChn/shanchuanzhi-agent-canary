name: M1 File Store Concurrency
on:
  pull_request:
    paths:
      - 'src/file-state-store.ts'
      - 'test/file-state-store.test.ts'
      - '.github/workflows/m1-file-store-concurrency.yml'

permissions:
  contents: read

jobs:
  ubuntu-node-22:
    name: Ubuntu Node 22 (file-store test x10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run the complete file-store test file ten times
        shell: bash
        run: |
          set -euo pipefail
          for iteration in {1..10}; do
            printf 'file-state-store test run %02d/10\n' "$iteration"
            node --import tsx --test test/file-state-store.test.ts
          done

  ubuntu-node-20:
    name: Ubuntu Node 20 (file-store test x10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run the complete file-store test file ten times
        shell: bash
        run: |
          set -euo pipefail
          for iteration in {1..10}; do
            printf 'file-state-store test run %02d/10\n' "$iteration"
            node --import tsx --test test/file-state-store.test.ts
          done
