name: M9 cross-module security composition

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-current-module-refs:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 36
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout M9 PR #36
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: refs/pull/36/head
          path: module-sources/m9

      - name: Checkout M1 PR #43 at candidate exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: a5eff766ebe041bc2c6cc13758827d5a96205de9
          path: module-sources/m1

      - name: Checkout M2 PR #37 at exact package candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 099ad64e4a09330920cbd40847adec3fe631e91e
          path: module-sources/m2
          fetch-depth: 0

      - name: Checkout M3 PR #33 at exact fixed protected-read candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 465bd606ed376054e5d9ae63b30f090dab7aec75
          path: module-sources/m3
          fetch-depth: 0

      - name: Checkout M4 PR #34 at exact desktop security-center source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: d5b84c4e035e8e51ab383d03c0b8ba0cb7bf9c84
          path: module-sources/m4

      - name: Checkout M5 PR #47 at exact trusted router source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: e6bb5cfaf5e3a55497ab300da3bf14bbb4b4b3d2
          path: module-sources/m5
          fetch-depth: 0

      - name: Checkout M6 PR #38 at exact source candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ef4679b276a90767bb1a6d7bd852aadc45b2d1cb
          path: module-sources/m6
          fetch-depth: 0

      - name: Checkout M7 PR #39 at exact integration source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 868842b1b7d76cf94a8d84a5f76c6acd4ca67f50
          path: module-sources/m7
          fetch-depth: 0

      - name: Checkout M8 PR #40 at exact source candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 72b4aab0fb5cb2dd4cd3b75ee8a73ad22dd001db
          path: module-sources/m8

      - name: Record checked-out commits and review evidence
        shell: bash
        run: |
          m9_sha="$(git -C module-sources/m9 rev-parse --verify HEAD)"
          m1_sha="$(git -C module-sources/m1 rev-parse --verify HEAD)"
          m2_sha="$(git -C module-sources/m2 rev-parse --verify HEAD)"
          m1_m2_review_status='APPROVE'
          m1_m2_review_sha="$m1_sha"
          m1_m2_review_target_sha="$m2_sha"
          m1_m2_review_comment='6349691761'
          m1_m2_review_issue='52'
          m1_m2_review_scope='adapter-to-Gateway contract only'
          m1_m2_review_condition='API contract only; no first-party product-host or TOCTOU acceptance'
          m2_prior_m1_disposition='ACCEPT_WITH_CONDITIONS'
          m2_prior_m1_disposition_sha='be66cf8f4c1a60f093740577796ec5cd633e1d93'
          m2_prior_m1_disposition_comment='6321070391'
          m2_prior_m1_disposition_issue='52'
          m2_package_alignment_gate_issue='69'
          m2_package_composition_history_issue='68'
          if ! git -C module-sources/m2 merge-base --is-ancestor "$m2_prior_m1_disposition_sha" "$m2_sha"; then
            echo 'Historical M1 disposition SHA is not an ancestor of the exact M2 package candidate.' >&2
            exit 1
          fi
          m3_sha="$(git -C module-sources/m3 rev-parse --verify HEAD)"
          m1_m3_review_status='ACCEPT'
          m1_m3_review_sha="$m1_sha"
          m1_m3_review_target_sha='27d4a20a20894c7b779edf68d8bf79685bc0e69b'
          m1_m3_review_comment='6347268881'
          m1_m3_review_issue='72'
          m4_sha="$(git -C module-sources/m4 rev-parse --verify HEAD)"
          m5_sha="$(git -C module-sources/m5 rev-parse --verify HEAD)"
          m5_code_sha="$(git -C module-sources/m5 rev-parse --verify 06fdbb060574e96e5d1eba5c77721014e0a81a3b^{commit})"
          if ! git -C module-sources/m5 merge-base --is-ancestor "$m5_code_sha" "$m5_sha"; then
            echo 'Pinned M5 code SHA is not an ancestor of the checked-out M5 head.' >&2
            exit 1
          fi
          m6_sha="$(git -C module-sources/m6 rev-parse --verify HEAD)"
          m6_prior_acceptance_status='ACCEPT'
          m6_prior_acceptance_sha='98803607b89f11e24430c461bd91e9c1a0ece9d4'
          m6_prior_acceptance_comment='6320039569'
          if ! git -C module-sources/m6 merge-base --is-ancestor "$m6_prior_acceptance_sha" "$m6_sha"; then
            echo 'Historical M6 acceptance SHA is not an ancestor of the exact source candidate.' >&2
            exit 1
          fi
          m7_sha="$(git -C module-sources/m7 rev-parse --verify HEAD)"
          m8_sha="$(git -C module-sources/m8 rev-parse --verify HEAD)"
          m6_m8_review_status='ACCEPT_WITH_CONDITIONS'
          m6_m8_review_m6_contract_sha='2cebabc81d7908c04ddfa10378fa1d3427b92cf4'
          m6_m8_review_target_sha="$m8_sha"
          m6_m8_review_comment='6346660246'
          m6_m8_review_issue='59'
          m6_m8_review_scope='M8 exact test hunk and M6 lifecycle contract checks only'
          {
            printf 'M9_SHA=%s\n' "$m9_sha"
            printf 'M1_SHA=%s\n' "$m1_sha"
            printf 'M1_M3_REVIEW_STATUS=%s\n' "$m1_m3_review_status"
            printf 'M1_M3_REVIEW_SHA=%s\n' "$m1_m3_review_sha"
            printf 'M1_M3_REVIEW_TARGET_SHA=%s\n' "$m1_m3_review_target_sha"
            printf 'M1_M3_REVIEW_COMMENT=%s\n' "$m1_m3_review_comment"
            printf 'M1_M3_REVIEW_ISSUE=%s\n' "$m1_m3_review_issue"
            printf 'M1_M2_REVIEW_STATUS=%s\n' "$m1_m2_review_status"
            printf 'M1_M2_REVIEW_SHA=%s\n' "$m1_m2_review_sha"
            printf 'M1_M2_REVIEW_TARGET_SHA=%s\n' "$m1_m2_review_target_sha"
            printf 'M1_M2_REVIEW_COMMENT=%s\n' "$m1_m2_review_comment"
            printf 'M1_M2_REVIEW_ISSUE=%s\n' "$m1_m2_review_issue"
            printf 'M1_M2_REVIEW_SCOPE=%s\n' "$m1_m2_review_scope"
            printf 'M1_M2_REVIEW_CONDITION=%s\n' "$m1_m2_review_condition"
            printf 'M2_SHA=%s\n' "$m2_sha"
            printf 'M2_PRIOR_M1_DISPOSITION=%s\n' "$m2_prior_m1_disposition"
            printf 'M2_PRIOR_M1_DISPOSITION_SHA=%s\n' "$m2_prior_m1_disposition_sha"
            printf 'M2_PRIOR_M1_DISPOSITION_COMMENT=%s\n' "$m2_prior_m1_disposition_comment"
            printf 'M2_PRIOR_M1_DISPOSITION_ISSUE=%s\n' "$m2_prior_m1_disposition_issue"
            printf 'M2_PACKAGE_ALIGNMENT_GATE_ISSUE=%s\n' "$m2_package_alignment_gate_issue"
            printf 'M2_PACKAGE_COMPOSITION_HISTORY_ISSUE=%s\n' "$m2_package_composition_history_issue"
            printf 'M3_SHA=%s\n' "$m3_sha"
            printf 'M4_SHA=%s\n' "$m4_sha"
            printf 'M5_SHA=%s\n' "$m5_sha"
            printf 'M5_CODE_SHA=%s\n' "$m5_code_sha"
            printf 'M6_SHA=%s\n' "$m6_sha"
            printf 'M6_PRIOR_ACCEPTANCE_STATUS=%s\n' "$m6_prior_acceptance_status"
            printf 'M6_PRIOR_ACCEPTANCE_SHA=%s\n' "$m6_prior_acceptance_sha"
            printf 'M6_PRIOR_ACCEPTANCE_COMMENT=%s\n' "$m6_prior_acceptance_comment"
            printf 'M6_M8_REVIEW_STATUS=%s\n' "$m6_m8_review_status"
            printf 'M6_M8_REVIEW_M6_CONTRACT_SHA=%s\n' "$m6_m8_review_m6_contract_sha"
            printf 'M6_M8_REVIEW_TARGET_SHA=%s\n' "$m6_m8_review_target_sha"
            printf 'M6_M8_REVIEW_COMMENT=%s\n' "$m6_m8_review_comment"
            printf 'M6_M8_REVIEW_ISSUE=%s\n' "$m6_m8_review_issue"
            printf 'M6_M8_REVIEW_SCOPE=%s\n' "$m6_m8_review_scope"
            printf 'M7_SHA=%s\n' "$m7_sha"
            printf 'M8_SHA=%s\n' "$m8_sha"
          } >> "$GITHUB_ENV"
          printf 'M1-to-M3 reviewed Hook source: %s (M1 %s; reviewed M3 commit %s; current M3 source %s; Issue #72 comment %s; Hook blobs checked unchanged)\n' "$m1_m3_review_status" "$m1_m3_review_sha" "$m1_m3_review_target_sha" "$m3_sha" "$m1_m3_review_comment" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'Exact source SHAs: M9=%s M1=%s M2=%s M3=%s M4=%s M5=%s M6=%s M7=%s M8=%s\n' "$m9_sha" "$m1_sha" "$m2_sha" "$m3_sha" "$m4_sha" "$m5_sha" "$m6_sha" "$m7_sha" "$m8_sha" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M1-to-M2 Issue #52: %s (M1 %s; M2 %s; comment %s; scope %s; boundary %s)\n' "$m1_m2_review_status" "$m1_m2_review_sha" "$m1_m2_review_target_sha" "$m1_m2_review_comment" "$m1_m2_review_scope" "$m1_m2_review_condition" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M1-to-M3 Hook disposition: %s (reviewed commit %s; current M3 %s; blobs rechecked; Issue #72 comment %s)\n' "$m1_m3_review_status" "$m1_m3_review_target_sha" "$m3_sha" "$m1_m3_review_comment" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M6-to-M8 scoped disposition: %s (reviewed M6 contract %s; current M6 %s; M8 %s; Issue #59 comment %s)\n' "$m6_m8_review_status" "$m6_m8_review_m6_contract_sha" "$m6_sha" "$m8_sha" "$m6_m8_review_comment" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install M9 test loader
        run: npm ci
        working-directory: module-sources/m9

      - name: Install M1 owner dependencies
        run: npm ci
        working-directory: module-sources/m1

      - name: Run exact M1 held-Gateway boundary regression
        working-directory: module-sources/m1
        run: node --import tsx --test test/gateway.test.ts

      - name: Install M2 exact-candidate dependencies
        run: npm ci
        working-directory: module-sources/m2

      - name: Build M2 exact package candidate
        run: npm run build
        working-directory: module-sources/m2

      - name: Run exact M7 package-smoke contract against the M2 candidate
        shell: bash
        working-directory: module-sources/m7
        run: |
          m7_sha="$(git rev-parse --verify HEAD)"
          test "$m7_sha" = '868842b1b7d76cf94a8d84a5f76c6acd4ca67f50'
          npm ci
          PACKAGE_ROOT="$GITHUB_WORKSPACE/module-sources/m2"
          npm run pack:check -- --package-root "$PACKAGE_ROOT"
          printf 'M7 integration source SHA: %s\nM2 package candidate SHA: %s\nRan M7 pack:check; the M2 CI package-policy pin is separately checked by the composition regression.\n' \
            "$m7_sha" "$M2_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pack M2 facade artifact for M3 fixed-host composition
        shell: bash
        working-directory: module-sources/m2
        run: |
          pack_dir="$RUNNER_TEMP/m9-m2-packed"
          consumer_root="$RUNNER_TEMP/m9-m2-consumer"
          mkdir -p "$pack_dir" "$consumer_root"
          filename="$(npm pack --json --pack-destination "$pack_dir" | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk);process.stdin.on("end",()=>process.stdout.write(JSON.parse(input)[0].filename))')"
          npm install --prefix "$consumer_root" --ignore-scripts --no-audit --no-fund "$pack_dir/$filename"
          printf 'M2_PACKED_ROOT=%s/node_modules/@dorianchn/agent-canary\n' "$consumer_root" >> "$GITHUB_ENV"
          printf 'M2_CONSUMER_ROOT=%s\n' "$consumer_root" >> "$GITHUB_ENV"
          printf 'M2 packed candidate artifact: %s\n' "$filename" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install M3 owner dependencies
        run: npm ci
        working-directory: module-sources/m3

      - name: Install M5 owner dependencies
        run: npm ci
        working-directory: module-sources/m5

      - name: Run M3 exact-source build and focused onboarding regressions
        working-directory: module-sources/m3
        run: |
          npm run build
          node --import tsx --test test/onboarding.test.ts test/codex-connection-check.test.ts test/agent-hook.test.ts test/security-center-route-m3.test.ts

      - name: Install M4 owner dependencies
        run: npm ci
        working-directory: module-sources/m4

      - name: Run exact M4 security-center build and focused desktop regressions
        working-directory: module-sources/m4
        run: |
          npm run build
          node --import tsx --test test/runtime-console.test.ts

      - name: Run exact M5 risk-policy regression
        working-directory: module-sources/m5
        run: node --import tsx --test test/risk-policy.test.ts

      - name: Run M6 exact-source bundle verification regression
        working-directory: module-sources/m6
        run: node --test security-lab/e4/verify-bundle.test.mjs

      - name: Run M6 exact-source Auto E4 lifecycle regression
        working-directory: module-sources/m6
        run: node --test test/auto-e4.test.mjs

      - name: Run M7 exact-head package-contract and positive-control regressions
        working-directory: module-sources/m7
        run: node --test --test-name-pattern="prepare output and build instructions pass the pinned ZIP and required source commit SHA|Windows payload E4 checks the co-located privacy-safe hook wrapper" test/windows-packaging.test.mjs

      - name: Run M8 exact-head provenance, LF checkout, and JSONL regressions
        working-directory: module-sources/m8
        run: |
          node --test --test-name-pattern="prepare build command carries the same Community ZIP and exact Hook source commit in documented argument order|Windows Hook provenance keeps LF checkout bytes equal to the tracked blob" test/windows-packaging.test.mjs
          node --test --test-name-pattern="co-located E4 payload wrapper logs only allowlisted metadata" test/auto-e4.test.mjs

      - name: Run exact-source M1/M2/M3/M4/M5/M6/M7/M8 M9 composition regressions
        working-directory: module-sources/m9
        env:
          M9_ROOT: ${{ github.workspace }}/module-sources/m9
          M1_ROOT: ${{ github.workspace }}/module-sources/m1
          M2_ROOT: ${{ github.workspace }}/module-sources/m2
          M3_ROOT: ${{ github.workspace }}/module-sources/m3
          M4_ROOT: ${{ github.workspace }}/module-sources/m4
          M5_ROOT: ${{ github.workspace }}/module-sources/m5
          M6_ROOT: ${{ github.workspace }}/module-sources/m6
          M7_ROOT: ${{ github.workspace }}/module-sources/m7
          M8_ROOT: ${{ github.workspace }}/module-sources/m8
          M2_PACKED_ROOT: ${{ runner.temp }}/m9-m2-consumer/node_modules/@dorianchn/agent-canary
          M2_CONSUMER_ROOT: ${{ runner.temp }}/m9-m2-consumer
        run: node --import tsx --test test/m9-cross-module-composition.test.mjs

      - name: Record evidence limits
        if: always()
        shell: bash
        run: |
          {
            echo
            echo 'Issue #69 closure applies only to its historical exact M2/M7 candidate; Issue #68 remains historical. M1 comment 6349691761 APPROVES M2 099ad64e4a09330920cbd40847adec3fe631e91e for the adapter-to-Gateway API contract only. This source composition does not establish product-host wiring or TOCTOU.'
            echo 'M1/M2/M5 evidence: verifyRealPaths=true denies path-only reads, writes, and deletes before callbacks. This fixture injects the exact pinned M5 router into the packed M2 public facade; M2 reserves and injects its tools, callback, and M1 capability wiring but does not authenticate router identity. A registered synthetic protected_read passes only when M5 resolves and verifies the M1 capability and M2 forwards that capability to M1 held-file execution. Sensitive paths and aliases remain denied before execution; verifyRealPaths=false is lexical policy only.'
            echo 'Active-capability negative controls cover a sensitive .env path, workspace and outside symlink/junction aliases, and a hard link alias named .env. M5 denies these before its M2 callback; direct packed-M2 executor calls reject all unregistered aliases before M1. No M1 runtime evidence or approval effect is added and fixture bytes/hashes remain unchanged.'
            echo 'Current pinned exact sources: M1 a5eff766ebe041bc2c6cc13758827d5a96205de9; M2 099ad64e4a09330920cbd40847adec3fe631e91e; M3 465bd606ed376054e5d9ae63b30f090dab7aec75; M4 d5b84c4e035e8e51ab383d03c0b8ba0cb7bf9c84; M5 e6bb5cfaf5e3a55497ab300da3bf14bbb4b4b3d2; M6 ef4679b276a90767bb1a6d7bd852aadc45b2d1cb; M7 868842b1b7d76cf94a8d84a5f76c6acd4ca67f50; M8 72b4aab0fb5cb2dd4cd3b75ee8a73ad22dd001db. M1 comment 6347268881 reviewed M3 source 27d4a20a20894c7b779edf68d8bf79685bc0e69b Hook blobs only; current M3 Hook blobs are asserted unchanged. Historical M2/M6 dispositions remain scoped to their original exact revisions.'
            echo 'No host callback reopens a path in the positive control; rejected calls create no approval and leave Gateway evidence and fixture bytes unchanged. This does not establish a production host integration.'
            echo 'M2/M3 scope: only the synthetic fixed protected_read route through the packed public facade and injected M5 router is covered; native Codex Shell remains UNPROTECTED / NOT_VERIFIED.'
            echo 'M3 evidence: exact-source build and focused onboarding/Gateway-connection/Hook tests, plus an M9 synthetic M3 protected_read host that loads the M2 packed public facade and injects the exact M5 router. The M3/M1 native Hook comparison still denies an unpinned normal Read; Hook trust/effectiveness and Native Codex Shell remain NOT_VERIFIED / OUT_OF_SCOPE.'
            echo 'M9 only observes fixed protected_read behavior in synthetic fixtures. Unsupported production-host integration and real concurrent/OS-atomic TOCTOU remain UNKNOWN; this does not close Issue #52.'
            echo 'M6 source-candidate evidence: exact SHA ef4679b276a90767bb1a6d7bd852aadc45b2d1cb runs the bundle/sidecar verifier and Auto E4 lifecycle regressions. Exact-head hosted CI still has Ubuntu Node 22 and macOS Node 20 pending. M6 comment 6346660246 reviews the M8 test hunk and M6 lifecycle contract at older M6 SHA 2cebabc81d7908c04ddfa10378fa1d3427b92cf4 only; prior acceptance 98803607b89f11e24430c461bd91e9c1a0ece9d4 is likewise historical. No product-host, installer, VM/model, or external E4 claim is made.'
            echo 'M7/M8 evidence: exact-owner build-command/provenance regressions, M8 LF checkout-policy assertion for the Hook source, and packaged/co-located JSONL positive-control tests. M7 byte comparison remains strict; M8 .gitattributes scopes LF normalization to its Hook source. M9 evidence: raw JSONL assertions for allowlisted fields, PreToolUse, enum allow, canonical ISO time, and caller/reason/path/command canaries absent.'
            echo 'M4 exact PR #34 source is independently built and its runtime-console tests run; M9 adds a synthetic check of redacted security-center output and conservative UNKNOWN states. It does not verify a live product host or backend data provenance.'
            echo 'M8 exact published PR head pin is 72b4aab0fb5cb2dd4cd3b75ee8a73ad22dd001db; the workflow runs its LF checkout provenance assertion and sanitized JSONL positive control. M7 is pinned to 868842b1b7d76cf94a8d84a5f76c6acd4ca67f50 for its updated E4 privacy audit and package smoke; M2 CI uses the older 167ebe81b76cc434facdaa3ddc62b42b9843951a pin whose relevant package-policy files are verified unchanged; this does not verify Setup.exe internals.'
            echo 'Scope: synthetic/co-located source-fixture composition only.'
            echo 'Issue #52 remains OPEN / P0 / NOT_VERIFIED for production-host held-identity consumption and TOCTOU.'
            echo 'Not established by this workflow: npm-installed E4, a built installer, clean-VM lifecycle, production native-host hookup, or external E4 independence.'
          } >> "$GITHUB_STEP_SUMMARY"
