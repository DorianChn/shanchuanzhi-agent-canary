name: M9 cross-module security composition

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-current-module-refs:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 36
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout M9 PR #36
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: refs/pull/36/head
          path: module-sources/m9

      - name: Checkout M1 PR #43 at candidate exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 7279336307fc7aacd46119405858d4fd91499757
          path: module-sources/m1

      - name: Checkout M2 PR #37 at exact package candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 868b12a4688282c28091b731f6548d5535c0c37c
          path: module-sources/m2
          fetch-depth: 0

      - name: Checkout M3 PR #33 at exact fixed protected-read candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 429cd73c03273bc77f3781b489f541e396cd9361
          path: module-sources/m3

      - name: Checkout M5 PR #47 at exact trusted router source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: bbce79aa086b39b51422cc72471c23c963778650
          path: module-sources/m5
          fetch-depth: 0

      - name: Checkout M6 PR #38 at exact source candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 2cebabc81d7908c04ddfa10378fa1d3427b92cf4
          path: module-sources/m6
          fetch-depth: 0

      - name: Checkout M7 PR #39 at exact package-smoke policy SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 167ebe81b76cc434facdaa3ddc62b42b9843951a
          path: module-sources/m7

      - name: Checkout M8 PR #40 at exact source candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 35ab804d9729590a572c01d16391e63472992622
          path: module-sources/m8

      - name: Record checked-out commits and review evidence
        shell: bash
        run: |
          m9_sha="$(git -C module-sources/m9 rev-parse --verify HEAD)"
          m1_sha="$(git -C module-sources/m1 rev-parse --verify HEAD)"
          m1_owner_review_sha="7279336307fc7aacd46119405858d4fd91499757"
          m2_sha="$(git -C module-sources/m2 rev-parse --verify HEAD)"
          m2_owner_disposition='ACCEPT_WITH_CONDITIONS'
          m2_owner_disposition_sha='be66cf8f4c1a60f093740577796ec5cd633e1d93'
          m2_owner_disposition_comment='6321070391'
          m2_owner_disposition_issue='52'
          m2_package_alignment_gate_issue='69'
          m2_package_composition_history_issue='68'
          if ! git -C module-sources/m2 merge-base --is-ancestor "$m2_owner_disposition_sha" "$m2_sha"; then
            echo 'M1-reviewed M2 disposition SHA is not an ancestor of the exact package candidate.' >&2
            exit 1
          fi
          m3_sha="$(git -C module-sources/m3 rev-parse --verify HEAD)"
          m5_sha="$(git -C module-sources/m5 rev-parse --verify HEAD)"
          m5_code_sha="$(git -C module-sources/m5 rev-parse --verify 06fdbb060574e96e5d1eba5c77721014e0a81a3b^{commit})"
          if ! git -C module-sources/m5 merge-base --is-ancestor "$m5_code_sha" "$m5_sha"; then
            echo 'Pinned M5 code SHA is not an ancestor of the checked-out M5 head.' >&2
            exit 1
          fi
          m6_sha="$(git -C module-sources/m6 rev-parse --verify HEAD)"
          m6_owner_acceptance_status='ACCEPT'
          m6_owner_acceptance_sha='98803607b89f11e24430c461bd91e9c1a0ece9d4'
          m6_owner_acceptance_comment='6320039569'
          if ! git -C module-sources/m6 merge-base --is-ancestor "$m6_owner_acceptance_sha" "$m6_sha"; then
            echo 'M6 owner-accepted SHA is not an ancestor of the exact source candidate.' >&2
            exit 1
          fi
          m7_sha="$(git -C module-sources/m7 rev-parse --verify HEAD)"
          m8_sha="$(git -C module-sources/m8 rev-parse --verify HEAD)"
          {
            printf 'M9_SHA=%s\n' "$m9_sha"
            printf 'M1_SHA=%s\n' "$m1_sha"
            printf 'M1_OWNER_REVIEW_SHA=%s\n' "$m1_owner_review_sha"
            printf 'M2_SHA=%s\n' "$m2_sha"
            printf 'M2_OWNER_DISPOSITION=%s\n' "$m2_owner_disposition"
            printf 'M2_OWNER_DISPOSITION_SHA=%s\n' "$m2_owner_disposition_sha"
            printf 'M2_OWNER_DISPOSITION_COMMENT=%s\n' "$m2_owner_disposition_comment"
            printf 'M2_OWNER_DISPOSITION_ISSUE=%s\n' "$m2_owner_disposition_issue"
            printf 'M2_PACKAGE_ALIGNMENT_GATE_ISSUE=%s\n' "$m2_package_alignment_gate_issue"
            printf 'M2_PACKAGE_COMPOSITION_HISTORY_ISSUE=%s\n' "$m2_package_composition_history_issue"
            printf 'M3_SHA=%s\n' "$m3_sha"
            printf 'M5_SHA=%s\n' "$m5_sha"
            printf 'M5_CODE_SHA=%s\n' "$m5_code_sha"
            printf 'M6_SHA=%s\n' "$m6_sha"
            printf 'M6_OWNER_ACCEPTANCE_STATUS=%s\n' "$m6_owner_acceptance_status"
            printf 'M6_OWNER_ACCEPTANCE_SHA=%s\n' "$m6_owner_acceptance_sha"
            printf 'M6_OWNER_ACCEPTANCE_COMMENT=%s\n' "$m6_owner_acceptance_comment"
            printf 'M7_SHA=%s\n' "$m7_sha"
            printf 'M8_SHA=%s\n' "$m8_sha"
          } >> "$GITHUB_ENV"
          printf 'M9: %s\nM1 head: %s\nM1 owner-review evidence: %s\nM2 package candidate: %s\nM2 prior owner disposition: %s for %s (Issue #52 comment %s; real M5 router required)\nIssue #69 OPEN: active M2/M7 package alignment gate; Issue #68 CLOSED: historical composition gate\nM3: %s\nM5 head: %s\nM5 code ancestor: %s\nM6 source candidate: %s\nM6 prior owner acceptance: %s for %s (Issue #59 comment %s)\nM7: %s\nM8: %s\n' \
            "$m9_sha" "$m1_sha" "$m1_owner_review_sha" "$m2_sha" "$m2_owner_disposition" "$m2_owner_disposition_sha" "$m2_owner_disposition_comment" "$m3_sha" "$m5_sha" "$m5_code_sha" "$m6_sha" "$m6_owner_acceptance_status" "$m6_owner_acceptance_sha" "$m6_owner_acceptance_comment" "$m7_sha" "$m8_sha" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install M9 test loader
        run: npm ci
        working-directory: module-sources/m9

      - name: Install M1 owner dependencies
        run: npm ci
        working-directory: module-sources/m1

      - name: Install M2 exact-candidate dependencies
        run: npm ci
        working-directory: module-sources/m2

      - name: Build M2 exact package candidate
        run: npm run build
        working-directory: module-sources/m2

      - name: Run exact M7 package-smoke contract against the M2 candidate
        shell: bash
        working-directory: module-sources/m7
        run: |
          m7_sha="$(git rev-parse --verify HEAD)"
          test "$m7_sha" = '167ebe81b76cc434facdaa3ddc62b42b9843951a'
          npm ci
          PACKAGE_ROOT="$GITHUB_WORKSPACE/module-sources/m2"
          npm run pack:check -- --package-root "$PACKAGE_ROOT"
          printf 'M7 package-smoke policy SHA: %s\nM2 package candidate SHA: %s\nRan the same pinned M7 pack:check command used by M2 CI.\n' \
            "$m7_sha" "$M2_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pack M2 facade artifact for M3 fixed-host composition
        shell: bash
        working-directory: module-sources/m2
        run: |
          pack_dir="$RUNNER_TEMP/m9-m2-packed"
          consumer_root="$RUNNER_TEMP/m9-m2-consumer"
          mkdir -p "$pack_dir" "$consumer_root"
          filename="$(npm pack --json --pack-destination "$pack_dir" | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk);process.stdin.on("end",()=>process.stdout.write(JSON.parse(input)[0].filename))')"
          npm install --prefix "$consumer_root" --ignore-scripts --no-audit --no-fund "$pack_dir/$filename"
          printf 'M2_PACKED_ROOT=%s/node_modules/@dorianchn/agent-canary\n' "$consumer_root" >> "$GITHUB_ENV"
          printf 'M2_CONSUMER_ROOT=%s\n' "$consumer_root" >> "$GITHUB_ENV"
          printf 'M2 packed candidate artifact: %s\n' "$filename" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install M3 owner dependencies
        run: npm ci
        working-directory: module-sources/m3

      - name: Install M5 owner dependencies
        run: npm ci
        working-directory: module-sources/m5

      - name: Run M3 exact-source build and focused onboarding regressions
        working-directory: module-sources/m3
        run: |
          npm run build
          node --import tsx --test test/onboarding.test.ts test/codex-connection-check.test.ts test/agent-hook.test.ts

      - name: Run M6 exact-source bundle verification regression
        working-directory: module-sources/m6
        run: node --test security-lab/e4/verify-bundle.test.mjs

      - name: Run M6 exact-source Auto E4 lifecycle regression
        working-directory: module-sources/m6
        run: node --test test/auto-e4.test.mjs

      - name: Run M7 exact-head package-contract and positive-control regressions
        working-directory: module-sources/m7
        run: node --test --test-name-pattern="prepare output and build instructions pass the pinned ZIP and required source commit SHA|Windows payload E4 checks the co-located privacy-safe hook wrapper" test/windows-packaging.test.mjs

      - name: Run M8 exact-head provenance, LF checkout, and JSONL regressions
        working-directory: module-sources/m8
        run: |
          node --test --test-name-pattern="prepare build command carries the same Community ZIP and exact Hook source commit in documented argument order|Windows Hook provenance keeps LF checkout bytes equal to the tracked blob" test/windows-packaging.test.mjs
          node --test --test-name-pattern="co-located E4 payload wrapper logs only allowlisted metadata" test/auto-e4.test.mjs

      - name: Run exact-source M1/M2/M3/M5/M6/M7/M8 M9 composition regressions
        working-directory: module-sources/m9
        env:
          M9_ROOT: ${{ github.workspace }}/module-sources/m9
          M1_ROOT: ${{ github.workspace }}/module-sources/m1
          M2_ROOT: ${{ github.workspace }}/module-sources/m2
          M3_ROOT: ${{ github.workspace }}/module-sources/m3
          M5_ROOT: ${{ github.workspace }}/module-sources/m5
          M6_ROOT: ${{ github.workspace }}/module-sources/m6
          M7_ROOT: ${{ github.workspace }}/module-sources/m7
          M8_ROOT: ${{ github.workspace }}/module-sources/m8
          M2_PACKED_ROOT: ${{ runner.temp }}/m9-m2-consumer/node_modules/@dorianchn/agent-canary
          M2_CONSUMER_ROOT: ${{ runner.temp }}/m9-m2-consumer
        run: node --import tsx --test test/m9-cross-module-composition.test.mjs

      - name: Record evidence limits
        if: always()
        shell: bash
        run: |
          {
            echo
            echo 'Issue #69 is OPEN and is the active M2/M7 package alignment gate; Issue #68 is CLOSED as the historical M2 facade-package composition gate. M1 comment 6321070391 on Issue #52 records ACCEPT WITH CONDITIONS only for exact M2 candidate be66cf8f4c1a60f093740577796ec5cd633e1d93 after actual-tarball review; exact M2 candidate 868b12a4688282c28091b731f6548d5535c0c37c is checked with the exact M7 167ebe81b76cc434facdaa3ddc62b42b9843951a pack:check contract below, but is not covered by that disposition: the first-party host must inject the trusted M5 router through the strict public facade; M2 does not authenticate router identity; OS-atomic TOCTOU remains unproven.'
            echo 'M1/M2/M5 evidence: verifyRealPaths=true denies path-only reads, writes, and deletes before callbacks. This fixture injects the exact pinned M5 router into the packed M2 public facade; M2 reserves and injects its tools, callback, and M1 capability wiring but does not authenticate router identity. A registered synthetic protected_read passes only when M5 resolves and verifies the M1 capability and M2 forwards that capability to M1 held-file execution. Sensitive paths and aliases remain denied before execution; verifyRealPaths=false is lexical policy only.'
            echo 'Active-capability negative controls cover a sensitive .env path, workspace and outside symlink/junction aliases, and a hard link alias named .env. M5 denies these before its M2 callback; direct packed-M2 executor calls reject all unregistered aliases before M1. No M1 evidence or approval is added and fixture bytes/hashes remain unchanged.'
            echo 'Candidate exact sources: M1 7279336307fc7aacd46119405858d4fd91499757; M2 package candidate 868b12a4688282c28091b731f6548d5535c0c37c; M3 429cd73c03273bc77f3781b489f541e396cd9361; M5 bbce79aa086b39b51422cc72471c23c963778650; M6 source candidate 2cebabc81d7908c04ddfa10378fa1d3427b92cf4; M7 167ebe81b76cc434facdaa3ddc62b42b9843951a (single-facade package policy only); M8 35ab804d9729590a572c01d16391e63472992622. Prior M1 disposition remains scoped to M2 be66cf8f4c1a60f093740577796ec5cd633e1d93 (Issue #52 comment 6321070391); prior M6 ACCEPT remains scoped to 98803607b89f11e24430c461bd91e9c1a0ece9d4 (Issue #59 comment 6320039569). Neither disposition accepts the later exact candidate. M1 owner-review evidence SHA 7279336307fc7aacd46119405858d4fd91499757 and M5 source-scope code SHA 06fdbb060574e96e5d1eba5c77721014e0a81a3b remain separate source gates. M2 has a read-only adapter and no write/delete adapter; these pins do not establish a production-host callsite or global host protection.'
            echo 'No host callback reopens a path in the positive control; rejected calls create no approval and leave Gateway evidence and fixture bytes unchanged. This does not establish a production host integration.'
            echo 'M2/M3 scope: only the synthetic fixed protected_read route through the packed public facade and injected M5 router is covered; native Codex Shell remains UNPROTECTED / NOT_VERIFIED.'
            echo 'M3 evidence: exact-source build and focused onboarding/Gateway-connection/Hook tests, plus an M9 synthetic M3 protected_read host that loads the M2 packed public facade and injects the exact M5 router. The M3/M1 native Hook comparison still denies an unpinned normal Read; Hook trust/effectiveness and Native Codex Shell remain NOT_VERIFIED / OUT_OF_SCOPE.'
            echo 'M9 only observes fixed protected_read behavior in synthetic fixtures. Unsupported production-host integration and real concurrent/OS-atomic TOCTOU remain UNKNOWN; this does not close Issue #52.'
            echo 'M6 source-candidate evidence: latest exact SHA 2cebabc81d7908c04ddfa10378fa1d3427b92cf4 runs the source-checkout bundle/sidecar verifier and full Auto E4 lifecycle regressions. M6 explicitly ACCEPTed only earlier exact SHA 98803607b89f11e24430c461bd91e9c1a0ece9d4 for packaging/windows/auto-e4.mjs lifecycle semantics and the complete test/auto-e4.test.mjs suite only (Issue #59 comment 6320039569: https://github.com/DorianChn/shanchuanzhi-agent-canary/issues/59#issuecomment-6320039569). This does not accept product-host integration, installer contents, VM/model execution, or independent external E4 validation. security-lab/e4 is outside the npm tarball and no npm-installed E4 was tested.'
            echo 'M7/M8 evidence: exact-owner build-command/provenance regressions, M8 LF checkout-policy assertion for the Hook source, and packaged/co-located JSONL positive-control tests. M7 byte comparison remains strict; M8 .gitattributes scopes LF normalization to its Hook source. M9 evidence: raw JSONL assertions for allowlisted fields, PreToolUse, enum allow, canonical ISO time, and caller/reason/path/command canaries absent.'
            echo 'M8 exact published PR head pin is 35ab804d9729590a572c01d16391e63472992622; the workflow runs its LF checkout provenance assertion and sanitized JSONL positive control. M7 is pinned to 167ebe81b76cc434facdaa3ddc62b42b9843951a for its single-facade package policy; this does not verify Setup.exe internals.'
            echo 'Scope: synthetic/co-located source-fixture composition only.'
            echo 'Issue #52 remains OPEN / P0 / NOT_VERIFIED for production-host held-identity consumption and TOCTOU.'
            echo 'Not established by this workflow: npm-installed E4, a built installer, clean-VM lifecycle, production native-host hookup, or external E4 independence.'
          } >> "$GITHUB_STEP_SUMMARY"
