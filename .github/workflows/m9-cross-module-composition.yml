name: M9 cross-module security composition

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-current-module-refs:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 36
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout M9 PR #36
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: refs/pull/36/head
          path: module-sources/m9

      - name: Checkout latest merged feature baseline for M1 Gateway source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 7cd34454c4bd6aa7176e0e076f5333639e3ccd5d
          path: module-sources/m1
          fetch-depth: 0

      - name: Checkout exact current M2 follow-up PR #91 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 92dd42b900b10ce0294e9e3faa7e175d728228b3
          path: module-sources/m2
          fetch-depth: 0

      - name: Checkout exact current M3 follow-up PR #90 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 98a034fa2066cec18f833440cc51275c389681c6
          path: module-sources/m3
          fetch-depth: 0

      - name: Checkout exact current M4 follow-up PR #98 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 892d3290338fe811da127f8f51ab91de0b9fc18b
          path: module-sources/m4
          fetch-depth: 0

      - name: Checkout exact current M5 follow-up PR #94 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: cca42cd1762f995e92454d55ffa5e63951e39144
          path: module-sources/m5
          fetch-depth: 0

      - name: Checkout M6 PR #38 actual merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: a6f4a889ec16b4f2c78f91d630e657eea7319dbd
          path: module-sources/m6
          fetch-depth: 0

      - name: Checkout exact current M7 follow-up PR #96 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 23e9490c38d4bfe986230f8a505ff088d60a6b20
          path: module-sources/m7
          fetch-depth: 0

      - name: Checkout historical M8 source used by the scoped M6 review regression
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 84ee6a7a8d65706f694b7949e82fd8c83cc11523
          path: module-sources/m8
          fetch-depth: 0

      - name: Checkout exact current M8 PR #40 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: 1abdfe3890c6c263eea667789deb7eab5038e828
          path: module-sources/m8-candidate
          fetch-depth: 0

      - name: Fetch merged PR owner heads for merge-tree provenance
        shell: bash
        run: |
          git -C module-sources/m1 fetch --no-tags origin refs/pull/83/head
          git -C module-sources/m2 fetch --no-tags origin refs/pull/37/head
          git -C module-sources/m3 fetch --no-tags origin refs/pull/33/head
          git -C module-sources/m4 fetch --no-tags origin refs/pull/34/head
          git -C module-sources/m5 fetch --no-tags origin refs/pull/47/head
          git -C module-sources/m6 fetch --no-tags origin refs/pull/38/head
          git -C module-sources/m7 fetch --no-tags origin refs/pull/84/head

      - name: Record checked-out commits and review evidence
        shell: bash
        run: |
          m9_sha="$(git -C module-sources/m9 rev-parse --verify HEAD)"
          m1_sha="$(git -C module-sources/m1 rev-parse --verify HEAD)"
          m2_sha="$(git -C module-sources/m2 rev-parse --verify HEAD)"
          m1_m2_review_status='APPROVE'
          m1_m2_review_sha='a5eff766ebe041bc2c6cc13758827d5a96205de9'
          m1_m2_review_target_sha='099ad64e4a09330920cbd40847adec3fe631e91e'
          m1_m2_review_comment='6349691761'
          m1_m2_review_issue='52'
          m1_m2_review_scope='adapter-to-Gateway contract only'
          m1_m2_review_condition='API contract only; no first-party product-host or TOCTOU acceptance'
          if ! git -C module-sources/m1 merge-base --is-ancestor "$m1_m2_review_sha" "$m1_sha"; then
            echo 'Historical M1-to-M2 API review SHA is not an ancestor of the exact M1 source candidate.' >&2
            exit 1
          fi
          if ! git -C module-sources/m2 merge-base --is-ancestor "$m1_m2_review_target_sha" "$m2_sha"; then
            echo 'The exact M2 source accepted by M1 is not an ancestor of the current M2 candidate.' >&2
            exit 1
          fi
          m2_prior_m1_disposition='ACCEPT_WITH_CONDITIONS'
          m2_prior_m1_disposition_sha='be66cf8f4c1a60f093740577796ec5cd633e1d93'
          m2_prior_m1_disposition_comment='6321070391'
          m2_prior_m1_disposition_issue='52'
          m2_package_alignment_gate_issue='69'
          m2_package_composition_history_issue='68'
          if ! git -C module-sources/m2 merge-base --is-ancestor "$m2_prior_m1_disposition_sha" "$m2_sha"; then
            echo 'Historical M1 disposition SHA is not an ancestor of the exact M2 package candidate.' >&2
            exit 1
          fi
          m3_sha="$(git -C module-sources/m3 rev-parse --verify HEAD)"
          m1_m3_review_sha='a5eff766ebe041bc2c6cc13758827d5a96205de9'
          m1_m3_review_target_sha='e771c06f72d8a03fb7945037a3facbc2d0ed8a6e'
          m1_m3_review_comment='6374247604'
          m1_m3_review_issue='72'
          if ! git -C module-sources/m1 merge-base --is-ancestor "$m1_m3_review_sha" "$m1_sha"; then
            echo 'Historical M1 Hook review SHA is not an ancestor of the exact M1 source candidate.' >&2
            exit 1
          fi
          m1_m3_review_status='ACCEPT'
          m1_m3_review_changed_files=''
          for reviewed_file in \
            'src/agent-hook.ts:76f7bf6314046777ee1615873e5de4621671ea15' \
            'test/agent-hook.test.ts:0e8a2250ee500d455b0c96430b33714925db3862' \
            'security-lab/claude-native-hook.mjs:b7ed4aba70a597f4f63a05decc6de1b32f67372e'; do
            file_path="${reviewed_file%%:*}"
            expected_blob="${reviewed_file#*:}"
            historical_blob="$(git -C module-sources/m3 rev-parse --verify "${m1_m3_review_target_sha}:${file_path}")"
            current_blob="$(git -C module-sources/m3 rev-parse --verify "${m3_sha}:${file_path}")"
            if [ "$historical_blob" != "$expected_blob" ]; then
              echo "The recorded M1 review blob is inconsistent at ${m1_m3_review_target_sha}:${file_path}." >&2
              exit 1
            fi
            if [ "$current_blob" != "$expected_blob" ]; then
              m1_m3_review_status='NOT_VERIFIED'
              m1_m3_review_changed_files="${m1_m3_review_changed_files} ${file_path}"
            fi
          done
          m4_sha="$(git -C module-sources/m4 rev-parse --verify HEAD)"
          m5_sha="$(git -C module-sources/m5 rev-parse --verify HEAD)"
          m5_code_sha="$(git -C module-sources/m5 rev-parse --verify f0e90c99033a6304748ac79fe106439ca4bd2e06^{commit})"
          if ! git -C module-sources/m5 merge-base --is-ancestor "$m5_code_sha" "$m5_sha"; then
            echo 'Pinned M5 merge SHA is not an ancestor of the checked-out M5 source.' >&2
            exit 1
          fi
          m6_sha="$(git -C module-sources/m6 rev-parse --verify HEAD)"
          m6_prior_acceptance_status='ACCEPT'
          m6_prior_acceptance_sha='98803607b89f11e24430c461bd91e9c1a0ece9d4'
          m6_prior_acceptance_comment='6320039569'
          if ! git -C module-sources/m6 merge-base --is-ancestor "$m6_prior_acceptance_sha" "$m6_sha"; then
            echo 'Historical M6 acceptance SHA is not an ancestor of the exact source candidate.' >&2
            exit 1
          fi
          m7_sha="$(git -C module-sources/m7 rev-parse --verify HEAD)"
          m8_sha="$(git -C module-sources/m8 rev-parse --verify HEAD)"
          m6_m8_review_status='ACCEPT_WITH_CONDITIONS'
          m6_m8_review_m6_contract_sha='2cebabc81d7908c04ddfa10378fa1d3427b92cf4'
          m6_m8_review_target_sha='72b4aab0fb5cb2dd4cd3b75ee8a73ad22dd001db'
          m6_m8_review_comment='6346660246'
          m6_m8_review_issue='59'
          m6_m8_review_scope='M8 exact test hunk and M6 lifecycle contract checks only'
          if ! git -C module-sources/m8 merge-base --is-ancestor "$m6_m8_review_target_sha" "$m8_sha"; then
            echo 'The exact M8 test source accepted by M6 is not an ancestor of the current M8 candidate.' >&2
            exit 1
          fi
          m8_candidate_sha="$(git -C module-sources/m8-candidate rev-parse --verify HEAD)"
          if [ "$m8_candidate_sha" != '1abdfe3890c6c263eea667789deb7eab5038e828' ]; then
            echo "M8 candidate checkout SHA mismatch: expected 1abdfe3890c6c263eea667789deb7eab5038e828, got $m8_candidate_sha" >&2
            exit 1
          fi
          if ! git -C module-sources/m8-candidate merge-base --is-ancestor "$m6_m8_review_target_sha" "$m8_candidate_sha"; then
            echo 'The exact M6-reviewed M8 source is not an ancestor of the current M8 PR candidate.' >&2
            exit 1
          fi
          {
            printf 'M9_SHA=%s\n' "$m9_sha"
            printf 'M1_SHA=%s\n' "$m1_sha"
            printf 'M1_M3_REVIEW_STATUS=%s\n' "$m1_m3_review_status"
            printf 'M1_M3_REVIEW_SHA=%s\n' "$m1_m3_review_sha"
            printf 'M1_M3_REVIEW_TARGET_SHA=%s\n' "$m1_m3_review_target_sha"
            printf 'M1_M3_REVIEW_COMMENT=%s\n' "$m1_m3_review_comment"
            printf 'M1_M3_REVIEW_ISSUE=%s\n' "$m1_m3_review_issue"
            printf 'M1_M2_REVIEW_STATUS=%s\n' "$m1_m2_review_status"
            printf 'M1_M2_REVIEW_SHA=%s\n' "$m1_m2_review_sha"
            printf 'M1_M2_REVIEW_TARGET_SHA=%s\n' "$m1_m2_review_target_sha"
            printf 'M1_M2_REVIEW_COMMENT=%s\n' "$m1_m2_review_comment"
            printf 'M1_M2_REVIEW_ISSUE=%s\n' "$m1_m2_review_issue"
            printf 'M1_M2_REVIEW_SCOPE=%s\n' "$m1_m2_review_scope"
            printf 'M1_M2_REVIEW_CONDITION=%s\n' "$m1_m2_review_condition"
            printf 'M2_SHA=%s\n' "$m2_sha"
            printf 'M2_PRIOR_M1_DISPOSITION=%s\n' "$m2_prior_m1_disposition"
            printf 'M2_PRIOR_M1_DISPOSITION_SHA=%s\n' "$m2_prior_m1_disposition_sha"
            printf 'M2_PRIOR_M1_DISPOSITION_COMMENT=%s\n' "$m2_prior_m1_disposition_comment"
            printf 'M2_PRIOR_M1_DISPOSITION_ISSUE=%s\n' "$m2_prior_m1_disposition_issue"
            printf 'M2_PACKAGE_ALIGNMENT_GATE_ISSUE=%s\n' "$m2_package_alignment_gate_issue"
            printf 'M2_PACKAGE_COMPOSITION_HISTORY_ISSUE=%s\n' "$m2_package_composition_history_issue"
            printf 'M3_SHA=%s\n' "$m3_sha"
            printf 'M4_SHA=%s\n' "$m4_sha"
            printf 'M5_SHA=%s\n' "$m5_sha"
            printf 'M5_CODE_SHA=%s\n' "$m5_code_sha"
            printf 'M6_SHA=%s\n' "$m6_sha"
            printf 'M6_PRIOR_ACCEPTANCE_STATUS=%s\n' "$m6_prior_acceptance_status"
            printf 'M6_PRIOR_ACCEPTANCE_SHA=%s\n' "$m6_prior_acceptance_sha"
            printf 'M6_PRIOR_ACCEPTANCE_COMMENT=%s\n' "$m6_prior_acceptance_comment"
            printf 'M6_M8_REVIEW_STATUS=%s\n' "$m6_m8_review_status"
            printf 'M6_M8_REVIEW_M6_CONTRACT_SHA=%s\n' "$m6_m8_review_m6_contract_sha"
            printf 'M6_M8_REVIEW_TARGET_SHA=%s\n' "$m6_m8_review_target_sha"
            printf 'M6_M8_REVIEW_COMMENT=%s\n' "$m6_m8_review_comment"
            printf 'M6_M8_REVIEW_ISSUE=%s\n' "$m6_m8_review_issue"
            printf 'M6_M8_REVIEW_SCOPE=%s\n' "$m6_m8_review_scope"
            printf 'M7_SHA=%s\n' "$m7_sha"
            printf 'M8_SHA=%s\n' "$m8_sha"
            printf 'M8_CANDIDATE_SHA=%s\n' "$m8_candidate_sha"
          } >> "$GITHUB_ENV"
          printf 'M1-to-M3 reviewed Hook source: %s (historical M1 review SHA %s; current M1 %s; reviewed M3 commit %s; current M3 source %s; changed reviewed files:%s; historical blobs verified; Issue #72 comment %s)\n' "$m1_m3_review_status" "$m1_m3_review_sha" "$m1_sha" "$m1_m3_review_target_sha" "$m3_sha" "${m1_m3_review_changed_files:- none}" "$m1_m3_review_comment" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'Exact source SHAs: M9=%s M1=%s M2=%s M3=%s M4=%s M5=%s M6=%s M7=%s M8=%s\n' "$m9_sha" "$m1_sha" "$m2_sha" "$m3_sha" "$m4_sha" "$m5_sha" "$m6_sha" "$m7_sha" "$m8_sha" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M1-to-M2 Issue #52: %s (historical M1 review SHA %s; current M1 %s; exact reviewed M2 %s; current M2 %s; comment %s; scope %s; boundary %s)\n' "$m1_m2_review_status" "$m1_m2_review_sha" "$m1_sha" "$m1_m2_review_target_sha" "$m2_sha" "$m1_m2_review_comment" "$m1_m2_review_scope" "$m1_m2_review_condition" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M1-to-M3 Hook disposition: %s (reviewed M3 %s; current M3 %s; changed reviewed files:%s; historical blobs verified; Issue #72 comment %s)\n' "$m1_m3_review_status" "$m1_m3_review_target_sha" "$m3_sha" "${m1_m3_review_changed_files:- none}" "$m1_m3_review_comment" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M6-to-M8 scoped disposition: %s (reviewed M6 contract %s; current M6 %s; exact reviewed M8 %s; current M8 %s; Issue #59 comment %s)\n' "$m6_m8_review_status" "$m6_m8_review_m6_contract_sha" "$m6_sha" "$m6_m8_review_target_sha" "$m8_sha" "$m6_m8_review_comment" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'Current M8 PR candidate: %s (exact source pinned for M9 checks; M1 exact-file review and M6 lifecycle-file disposition remain pending)\n' "$m8_candidate_sha" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install M9 test loader
        run: npm ci
        working-directory: module-sources/m9

      - name: Install M1 owner dependencies
        run: npm ci
        working-directory: module-sources/m1

      - name: Run exact M1 held-Gateway boundary regression
        working-directory: module-sources/m1
        run: |
          npm run build
          node --import tsx --test test/gateway.test.ts

      - name: Install M2 exact-candidate dependencies
        run: npm ci
        working-directory: module-sources/m2

      - name: Build M2 exact package candidate
        run: npm run build
        working-directory: module-sources/m2

      - name: Run exact M7 package-smoke contract against the M2 candidate
        shell: bash
        working-directory: module-sources/m7
        run: |
          m7_sha="$(git rev-parse --verify HEAD)"
          test "$m7_sha" = '23e9490c38d4bfe986230f8a505ff088d60a6b20'
          npm ci
          PACKAGE_ROOT="$GITHUB_WORKSPACE/module-sources/m2"
          npm run pack:check -- --package-root "$PACKAGE_ROOT"
          printf 'M7 integration source SHA: %s\nM2 package candidate SHA: %s\nRan M7 pack:check; the M2 CI package-policy pin is separately checked by the composition regression.\n' \
            "$m7_sha" "$M2_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run exact M7 installer-receipt telemetry regressions
        shell: bash
        working-directory: module-sources/m7
        run: |
          m7_sha="$(git rev-parse --verify HEAD)"
          test "$m7_sha" = '23e9490c38d4bfe986230f8a505ff088d60a6b20'
          node --import tsx --test --test-name-pattern="Windows lifecycle smoke is isolated, same-run, checksum-bound, and limited" test/reliability.test.mjs
          node --test --test-name-pattern="Windows payload build copies every local worker module dependency|record-install keeps normal behavior when M7 phase telemetry is disabled|record-install emits only the final fixed marker when the exact M7 toggle is enabled|record-install does not enable M7 phase telemetry for non-exact toggle values" packaging/windows/test-worker.mjs

      - name: Pack M2 facade artifact for M3 fixed-host composition
        shell: bash
        working-directory: module-sources/m2
        run: |
          pack_dir="$RUNNER_TEMP/m9-m2-packed"
          consumer_root="$RUNNER_TEMP/m9-m2-consumer"
          mkdir -p "$pack_dir" "$consumer_root"
          filename="$(npm pack --json --pack-destination "$pack_dir" | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk);process.stdin.on("end",()=>process.stdout.write(JSON.parse(input)[0].filename))')"
          npm install --prefix "$consumer_root" --ignore-scripts --no-audit --no-fund "$pack_dir/$filename"
          printf 'M2_PACKED_ROOT=%s/node_modules/@dorianchn/agent-canary\n' "$consumer_root" >> "$GITHUB_ENV"
          printf 'M2_CONSUMER_ROOT=%s\n' "$consumer_root" >> "$GITHUB_ENV"
          printf 'M2 packed candidate artifact: %s\n' "$filename" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install M3 owner dependencies
        run: npm ci
        working-directory: module-sources/m3

      - name: Install M5 owner dependencies
        run: npm ci
        working-directory: module-sources/m5

      - name: Run M3 exact-source build and focused onboarding regressions
        working-directory: module-sources/m3
        run: |
          npm run build
          node --import tsx --test test/onboarding.test.ts test/codex-connection-check.test.ts test/agent-hook.test.ts test/security-center-route-m3.test.ts

      - name: Install M4 owner dependencies
        run: npm ci
        working-directory: module-sources/m4

      - name: Run exact M4 security-center build and focused desktop regressions
        working-directory: module-sources/m4
        run: |
          npm run build
          node --import tsx --test test/runtime-console.test.ts

      - name: Run exact M5 risk-policy regression
        working-directory: module-sources/m5
        run: |
          npm run build
          node --import tsx --test test/risk-policy.test.ts test/policy-router-export.test.ts test/policy-management.test.ts

      - name: Run M3 adapter regressions in the exact coordinated M5 candidate
        working-directory: module-sources/m5
        run: node --import tsx --test test/codex-connection-check.test.ts

      - name: Run exact M5-source M3 packaged owner-consumer contract
        shell: pwsh
        working-directory: module-sources/m5
        env:
          M1_ROOT: ${{ github.workspace }}/module-sources/m1
          M2_PACKED_ROOT: ${{ runner.temp }}/m9-m2-consumer/node_modules/@dorianchn/agent-canary
          M3_ROOT: ${{ github.workspace }}/module-sources/m5
          M5_ROOT: ${{ github.workspace }}/module-sources/m5
        run: |
          if ($env:RUNNER_OS -eq 'Windows') {
            $nativeTar = Join-Path $env:WINDIR 'System32\tar.exe'
            if (-not (Test-Path $nativeTar)) { throw 'Windows-native tar.exe is required for the packaged consumer test.' }
            $env:PATH = "$(Split-Path $nativeTar);$env:PATH"
            $resolvedTar = (Get-Command tar -CommandType Application | Select-Object -First 1).Source
            if ($resolvedTar -ine $nativeTar) { throw "Expected Windows-native tar.exe first on PATH, got $resolvedTar" }
          }
          node --test test/packaged-owner-consumer.test.mjs

      - name: Run M6 exact-source bundle verification regression
        working-directory: module-sources/m6
        run: node --test security-lab/e4/verify-bundle.test.mjs

      - name: Run M6 exact-source Auto E4 lifecycle regression
        working-directory: module-sources/m6
        run: node --test test/auto-e4.test.mjs

      - name: Run M7 exact-head package-contract and positive-control regressions
        working-directory: module-sources/m7
        run: node --test --test-name-pattern="prepare output and build instructions pass the pinned ZIP and required source commit SHA|Windows payload E4 checks the co-located privacy-safe hook wrapper|silent receipt failure chooses a safe default then still rolls back and aborts" test/windows-packaging.test.mjs

      - name: Run historical M8 provenance and scoped M6-review regressions
        working-directory: module-sources/m8
        run: |
          node --test --test-name-pattern="prepare build command carries the same Community ZIP and exact Hook source commit in documented argument order|Windows Hook provenance keeps LF checkout bytes equal to the tracked blob" test/windows-packaging.test.mjs
          node --test --test-name-pattern="co-located E4 payload wrapper logs only allowlisted metadata" test/auto-e4.test.mjs

      - name: Run current M8 PR #40 Hook output regression
        working-directory: module-sources/m8-candidate
        run: node --test security-lab/claude-native-hook-output.test.mjs

      - name: Run exact-source M1/M2/M3/M4/M5/M6/M7/M8 M9 composition regressions
        working-directory: module-sources/m9
        env:
          M9_ROOT: ${{ github.workspace }}/module-sources/m9
          M1_ROOT: ${{ github.workspace }}/module-sources/m1
          M2_ROOT: ${{ github.workspace }}/module-sources/m2
          M3_ROOT: ${{ github.workspace }}/module-sources/m3
          M4_ROOT: ${{ github.workspace }}/module-sources/m4
          M5_ROOT: ${{ github.workspace }}/module-sources/m5
          M6_ROOT: ${{ github.workspace }}/module-sources/m6
          M7_ROOT: ${{ github.workspace }}/module-sources/m7
          M8_ROOT: ${{ github.workspace }}/module-sources/m8
          M8_CANDIDATE_ROOT: ${{ github.workspace }}/module-sources/m8-candidate
          M2_PACKED_ROOT: ${{ runner.temp }}/m9-m2-consumer/node_modules/@dorianchn/agent-canary
          M2_CONSUMER_ROOT: ${{ runner.temp }}/m9-m2-consumer
