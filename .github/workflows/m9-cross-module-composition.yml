name: M9 cross-module security composition

on:
  pull_request:
    branches:
      - feature/agent-canary-3.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-current-module-refs:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.base.ref == 'feature/agent-canary-3.0'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      MANUAL_SHA: ${{ github.sha }}
    steps:
      - name: Select immutable M9 source SHA
        id: m9-ref
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            if [[ "$PR_HEAD_REF" == 'feature/ac3-m9-integration' ]]; then
              m9_source_sha="$PR_HEAD_SHA"
            else
              m9_source_sha="$PR_BASE_SHA"
            fi
          else
            m9_source_sha="$MANUAL_SHA"
          fi
          if [[ ! "$m9_source_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "M9 source must be an immutable 40-character commit SHA: $m9_source_sha" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$m9_source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact M9 source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ${{ steps.m9-ref.outputs.sha }}
          path: module-sources/m9
          fetch-depth: 0

      - name: Validate exact-source manifest and checkout refs
        id: source-manifest
        working-directory: module-sources/m9
        shell: bash
        env:
          EXPECTED_M9_SHA: ${{ steps.m9-ref.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/validate-m9-exact-source-manifest.mjs

      - name: Checkout exact M1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ${{ steps.source-manifest.outputs.m1 }}
          path: module-sources/m1
          fetch-depth: 0

      - name: Checkout exact M2 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ${{ steps.source-manifest.outputs.m2 }}
          path: module-sources/m2
          fetch-depth: 0

      - name: Checkout exact M3 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ${{ steps.source-manifest.outputs.m3 }}
          path: module-sources/m3
          fetch-depth: 0

      - name: Checkout exact M4 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ${{ steps.source-manifest.outputs.m4 }}
          path: module-sources/m4
          fetch-depth: 0

      - name: Checkout exact M5 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ${{ steps.source-manifest.outputs.m5 }}
          path: module-sources/m5
          fetch-depth: 0

      - name: Checkout exact M6 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ${{ steps.source-manifest.outputs.m6 }}
          path: module-sources/m6
          fetch-depth: 0

      - name: Checkout exact M7 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ${{ steps.source-manifest.outputs.m7 }}
          path: module-sources/m7
          fetch-depth: 0

      - name: Checkout exact historical M8 source for the M6-scoped regression
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ${{ steps.source-manifest.outputs.m8_history }}
          path: module-sources/m8
          fetch-depth: 0

      - name: Checkout exact current M8 source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DorianChn/shanchuanzhi-agent-canary
          ref: ${{ steps.source-manifest.outputs.m8 }}
          path: module-sources/m8-candidate
          fetch-depth: 0

      - name: Record checked-out commits and review evidence
        id: record-sources
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_M9_SHA: ${{ steps.m9-ref.outputs.sha }}
          EXPECTED_M1_SHA: ${{ steps.source-manifest.outputs.m1 }}
          EXPECTED_M2_SHA: ${{ steps.source-manifest.outputs.m2 }}
          EXPECTED_M3_SHA: ${{ steps.source-manifest.outputs.m3 }}
          EXPECTED_M4_SHA: ${{ steps.source-manifest.outputs.m4 }}
          EXPECTED_M5_SHA: ${{ steps.source-manifest.outputs.m5 }}
          EXPECTED_M6_SHA: ${{ steps.source-manifest.outputs.m6 }}
          EXPECTED_M7_SHA: ${{ steps.source-manifest.outputs.m7 }}
          EXPECTED_M8_HISTORY_SHA: ${{ steps.source-manifest.outputs.m8_history }}
          EXPECTED_M8_SHA: ${{ steps.source-manifest.outputs.m8 }}
          M6_REVIEW_STATUS: ${{ steps.source-manifest.outputs.m6_review_status }}
          M6_REVIEW_TARGET_SHA: ${{ steps.source-manifest.outputs.m6_review_target_sha }}
          M6_REVIEWED_SHA: ${{ steps.source-manifest.outputs.m6_reviewed_sha }}
          M6_REVIEW_COMMENT_ID: ${{ steps.source-manifest.outputs.m6_review_comment_id }}
          M6_REVIEW_ISSUE: ${{ steps.source-manifest.outputs.m6_review_issue }}
          M6_REVIEW_TEST_BLOB: ${{ steps.source-manifest.outputs.m6_review_test_blob }}
          M6_REVIEW_VERIFIER_TEST_BLOB: ${{ steps.source-manifest.outputs.m6_review_verifier_test_blob }}
        run: |
          m9_sha="$(git -C module-sources/m9 rev-parse --verify HEAD)"
          m1_sha="$(git -C module-sources/m1 rev-parse --verify HEAD)"
          m2_sha="$(git -C module-sources/m2 rev-parse --verify HEAD)"
          m3_sha="$(git -C module-sources/m3 rev-parse --verify HEAD)"
          m4_sha="$(git -C module-sources/m4 rev-parse --verify HEAD)"
          m5_sha="$(git -C module-sources/m5 rev-parse --verify HEAD)"
          m6_sha="$(git -C module-sources/m6 rev-parse --verify HEAD)"
          m7_sha="$(git -C module-sources/m7 rev-parse --verify HEAD)"
          m8_sha="$(git -C module-sources/m8 rev-parse --verify HEAD)"
          m8_candidate_sha="$(git -C module-sources/m8-candidate rev-parse --verify HEAD)"
          {
            printf 'M9_SHA=%s\n' "$m9_sha"
            printf 'M1_SHA=%s\n' "$m1_sha"
            printf 'M2_SHA=%s\n' "$m2_sha"
            printf 'M3_SHA=%s\n' "$m3_sha"
            printf 'M4_SHA=%s\n' "$m4_sha"
            printf 'M5_SHA=%s\n' "$m5_sha"
            printf 'M6_SHA=%s\n' "$m6_sha"
            printf 'M7_SHA=%s\n' "$m7_sha"
            printf 'M8_SHA=%s\n' "$m8_sha"
            printf 'M8_CANDIDATE_SHA=%s\n' "$m8_candidate_sha"
            printf 'M6_M8_CURRENT_LIFECYCLE_REVIEW_STATUS=%s\n' "$M6_REVIEW_STATUS"
            printf 'M6_M8_CURRENT_LIFECYCLE_REVIEW_SHA=%s\n' "$M6_REVIEW_TARGET_SHA"
            printf 'M6_M8_CURRENT_LIFECYCLE_REVIEWED_SHA=%s\n' "$M6_REVIEWED_SHA"
            printf 'M6_M8_CURRENT_LIFECYCLE_REVIEW_BLOB=%s\n' "$M6_REVIEW_TEST_BLOB"
            printf 'M6_M8_CURRENT_LIFECYCLE_REVIEW_COMMENT=%s\n' "$M6_REVIEW_COMMENT_ID"
            printf 'M6_M8_CURRENT_LIFECYCLE_REVIEW_ISSUE=%s\n' "$M6_REVIEW_ISSUE"
            printf 'M6_M8_CURRENT_LIFECYCLE_REVIEW_VERIFIER_BLOB=%s\n' "$M6_REVIEW_VERIFIER_TEST_BLOB"
          } >> "$GITHUB_ENV"
          verify_exact_source() {
            local name="$1" actual="$2" expected="$3"
            if [[ ! "$expected" =~ ^[a-f0-9]{40}$ || "$actual" != "$expected" ]]; then
              echo "$name exact checkout mismatch: expected $expected, got $actual" >&2
              return 1
            fi
          }
          verify_exact_source M9 "$m9_sha" "$EXPECTED_M9_SHA" || exit 1
          verify_exact_source M1 "$m1_sha" "$EXPECTED_M1_SHA" || exit 1
          verify_exact_source M2 "$m2_sha" "$EXPECTED_M2_SHA" || exit 1
          verify_exact_source M3 "$m3_sha" "$EXPECTED_M3_SHA" || exit 1
          verify_exact_source M4 "$m4_sha" "$EXPECTED_M4_SHA" || exit 1
          verify_exact_source M5 "$m5_sha" "$EXPECTED_M5_SHA" || exit 1
          verify_exact_source M6 "$m6_sha" "$EXPECTED_M6_SHA" || exit 1
          verify_exact_source M7 "$m7_sha" "$EXPECTED_M7_SHA" || exit 1
          verify_exact_source M8-history "$m8_sha" "$EXPECTED_M8_HISTORY_SHA" || exit 1
          verify_exact_source M8-candidate "$m8_candidate_sha" "$EXPECTED_M8_SHA" || exit 1
          m1_m2_review_status='APPROVE'
          m1_m2_review_sha='a5eff766ebe041bc2c6cc13758827d5a96205de9'
          m1_m2_review_target_sha='099ad64e4a09330920cbd40847adec3fe631e91e'
          m1_m2_review_comment='6349691761'
          m1_m2_review_issue='52'
          m1_m2_review_scope='adapter-to-Gateway contract only'
          m1_m2_review_condition='API contract only; no first-party product-host or TOCTOU acceptance'
          if ! git -C module-sources/m1 merge-base --is-ancestor "$m1_m2_review_sha" "$m1_sha"; then
            echo 'Historical M1-to-M2 API review SHA is not an ancestor of the exact M1 source candidate.' >&2
            exit 1
          fi
          if ! git -C module-sources/m2 merge-base --is-ancestor "$m1_m2_review_target_sha" "$m2_sha"; then
            echo 'The exact M2 source accepted by M1 is not an ancestor of the current M2 candidate.' >&2
            exit 1
          fi
          m2_prior_m1_disposition='ACCEPT_WITH_CONDITIONS'
          m2_prior_m1_disposition_sha='be66cf8f4c1a60f093740577796ec5cd633e1d93'
          m2_prior_m1_disposition_comment='6321070391'
          m2_prior_m1_disposition_issue='52'
          m2_package_alignment_gate_issue='69'
          m2_package_composition_history_issue='68'
          if ! git -C module-sources/m2 merge-base --is-ancestor "$m2_prior_m1_disposition_sha" "$m2_sha"; then
            echo 'Historical M1 disposition SHA is not an ancestor of the exact M2 package candidate.' >&2
            exit 1
          fi
          m1_m3_review_sha='47501fc090ee67f7f96d84d231c7ce7cc70379cd'
          m1_m3_review_target_sha='0d61b434ba2ac81e313b82432f4ac00afedd3cbc'
          m1_m3_review_comment='6386280736'
          m1_m3_review_issue='72'
          if ! git -C module-sources/m1 merge-base --is-ancestor "$m1_m3_review_sha" "$m1_sha"; then
            echo 'Historical M1 Hook review SHA is not an ancestor of the exact M1 source candidate.' >&2
            exit 1
          fi
          m1_m3_review_status='ACCEPT'
          m1_m3_review_changed_files=''
          for reviewed_file in \
            'src/agent-hook.ts:76f7bf6314046777ee1615873e5de4621671ea15' \
            'test/agent-hook.test.ts:10cdb80b4ca6b19eac7696dc1a85d5cc9f984ae2' \
            'security-lab/claude-native-hook.mjs:b7ed4aba70a597f4f63a05decc6de1b32f67372e'; do
            file_path="${reviewed_file%%:*}"
            expected_blob="${reviewed_file#*:}"
            historical_blob="$(git -C module-sources/m3 rev-parse --verify "${m1_m3_review_target_sha}:${file_path}")"
            current_blob="$(git -C module-sources/m3 rev-parse --verify "${m3_sha}:${file_path}")"
            if [ "$historical_blob" != "$expected_blob" ]; then
              echo "The recorded M1 review blob is inconsistent at ${m1_m3_review_target_sha}:${file_path}." >&2
              exit 1
            fi
            if [ "$current_blob" != "$expected_blob" ]; then
              m1_m3_review_status='NOT_VERIFIED'
              m1_m3_review_changed_files="${m1_m3_review_changed_files} ${file_path}"
            fi
          done
          m5_sha="$(git -C module-sources/m5 rev-parse --verify HEAD)"
          m5_code_sha="$(git -C module-sources/m5 rev-parse --verify f0e90c99033a6304748ac79fe106439ca4bd2e06^{commit})"
          if ! git -C module-sources/m5 merge-base --is-ancestor "$m5_code_sha" "$m5_sha"; then
            echo 'Pinned M5 merge SHA is not an ancestor of the checked-out M5 source.' >&2
            exit 1
          fi
          m6_prior_acceptance_status='ACCEPT'
          m6_prior_acceptance_sha='98803607b89f11e24430c461bd91e9c1a0ece9d4'
          m6_prior_acceptance_comment='6320039569'
          if ! git -C module-sources/m6 merge-base --is-ancestor "$m6_prior_acceptance_sha" "$m6_sha"; then
            echo 'Historical M6 acceptance SHA is not an ancestor of the exact source candidate.' >&2
            exit 1
          fi
          m6_m8_review_status='ACCEPT_WITH_CONDITIONS'
          m6_m8_review_m6_contract_sha='2cebabc81d7908c04ddfa10378fa1d3427b92cf4'
          m6_m8_review_target_sha='72b4aab0fb5cb2dd4cd3b75ee8a73ad22dd001db'
          m6_m8_review_comment='6346660246'
          m6_m8_review_issue='59'
          m6_m8_review_scope='M8 exact test hunk and M6 lifecycle contract checks only'
          if ! git -C module-sources/m8 merge-base --is-ancestor "$m6_m8_review_target_sha" "$m8_sha"; then
            echo 'The exact M8 test source accepted by M6 is not an ancestor of the current M8 candidate.' >&2
            exit 1
          fi
          if ! git -C module-sources/m8-candidate merge-base --is-ancestor "$m6_m8_review_target_sha" "$m8_candidate_sha"; then
            echo 'The exact M6-reviewed M8 source is not an ancestor of the current M8 PR candidate.' >&2
            exit 1
          fi
          m1_m8_hook_review_status='ACCEPT'
          m1_m8_hook_review_source_sha='1abdfe3890c6c263eea667789deb7eab5038e828'
          m1_m8_hook_review_comment='6374253075'
          m1_m8_hook_review_issue='80'
          m1_m8_hook_blob='b7ed4aba70a597f4f63a05decc6de1b32f67372e'
          m1_m8_output_test_blob='186fa2d163f7118d10f01abdac91a0b5e657359b'
          if ! git -C module-sources/m8-candidate merge-base --is-ancestor "$m1_m8_hook_review_source_sha" "$m8_candidate_sha"; then
            echo 'The M1-reviewed M8 Hook source must remain an ancestor of the exact candidate.' >&2
            exit 1
          fi
          if [ "$(git -C module-sources/m8-candidate rev-parse --verify "${m8_candidate_sha}:security-lab/claude-native-hook.mjs")" != "$m1_m8_hook_blob" ] || [ "$(git -C module-sources/m8-candidate rev-parse --verify "${m8_candidate_sha}:security-lab/claude-native-hook-output.test.mjs")" != "$m1_m8_output_test_blob" ]; then
            echo 'The exact Hook files covered by M1 Issue #80 review changed in the current M8 candidate.' >&2
            exit 1
          fi
          m6_m8_current_lifecycle_review_status="$M6_REVIEW_STATUS"
          m6_m8_current_lifecycle_review_sha="$M6_REVIEW_TARGET_SHA"
          m6_m8_current_lifecycle_reviewed_sha="$M6_REVIEWED_SHA"
          m6_m8_current_lifecycle_review_blob="$M6_REVIEW_TEST_BLOB"
          m6_m8_current_lifecycle_review_comment="$M6_REVIEW_COMMENT_ID"
          m6_m8_current_lifecycle_review_issue="$M6_REVIEW_ISSUE"
          {
            printf 'M1_M3_REVIEW_STATUS=%s\n' "$m1_m3_review_status"
            printf 'M1_M3_REVIEW_SHA=%s\n' "$m1_m3_review_sha"
            printf 'M1_M3_REVIEW_TARGET_SHA=%s\n' "$m1_m3_review_target_sha"
            printf 'M1_M3_REVIEW_COMMENT=%s\n' "$m1_m3_review_comment"
            printf 'M1_M3_REVIEW_ISSUE=%s\n' "$m1_m3_review_issue"
            printf 'M1_M2_REVIEW_STATUS=%s\n' "$m1_m2_review_status"
            printf 'M1_M2_REVIEW_SHA=%s\n' "$m1_m2_review_sha"
            printf 'M1_M2_REVIEW_TARGET_SHA=%s\n' "$m1_m2_review_target_sha"
            printf 'M1_M2_REVIEW_COMMENT=%s\n' "$m1_m2_review_comment"
            printf 'M1_M2_REVIEW_ISSUE=%s\n' "$m1_m2_review_issue"
            printf 'M1_M2_REVIEW_SCOPE=%s\n' "$m1_m2_review_scope"
            printf 'M1_M2_REVIEW_CONDITION=%s\n' "$m1_m2_review_condition"
            printf 'M2_PRIOR_M1_DISPOSITION=%s\n' "$m2_prior_m1_disposition"
            printf 'M2_PRIOR_M1_DISPOSITION_SHA=%s\n' "$m2_prior_m1_disposition_sha"
            printf 'M2_PRIOR_M1_DISPOSITION_COMMENT=%s\n' "$m2_prior_m1_disposition_comment"
            printf 'M2_PRIOR_M1_DISPOSITION_ISSUE=%s\n' "$m2_prior_m1_disposition_issue"
            printf 'M2_PACKAGE_ALIGNMENT_GATE_ISSUE=%s\n' "$m2_package_alignment_gate_issue"
            printf 'M2_PACKAGE_COMPOSITION_HISTORY_ISSUE=%s\n' "$m2_package_composition_history_issue"
            printf 'M5_CODE_SHA=%s\n' "$m5_code_sha"
            printf 'M6_PRIOR_ACCEPTANCE_STATUS=%s\n' "$m6_prior_acceptance_status"
            printf 'M6_PRIOR_ACCEPTANCE_SHA=%s\n' "$m6_prior_acceptance_sha"
            printf 'M6_PRIOR_ACCEPTANCE_COMMENT=%s\n' "$m6_prior_acceptance_comment"
            printf 'M6_M8_REVIEW_STATUS=%s\n' "$m6_m8_review_status"
            printf 'M6_M8_REVIEW_M6_CONTRACT_SHA=%s\n' "$m6_m8_review_m6_contract_sha"
            printf 'M6_M8_REVIEW_TARGET_SHA=%s\n' "$m6_m8_review_target_sha"
            printf 'M6_M8_REVIEW_COMMENT=%s\n' "$m6_m8_review_comment"
            printf 'M6_M8_REVIEW_ISSUE=%s\n' "$m6_m8_review_issue"
            printf 'M6_M8_REVIEW_SCOPE=%s\n' "$m6_m8_review_scope"
            printf 'M1_M8_HOOK_REVIEW_STATUS=%s\n' "$m1_m8_hook_review_status"
            printf 'M1_M8_HOOK_REVIEW_SOURCE_SHA=%s\n' "$m1_m8_hook_review_source_sha"
            printf 'M1_M8_HOOK_REVIEW_COMMENT=%s\n' "$m1_m8_hook_review_comment"
            printf 'M1_M8_HOOK_REVIEW_ISSUE=%s\n' "$m1_m8_hook_review_issue"
            printf 'M1_M8_HOOK_BLOB=%s\n' "$m1_m8_hook_blob"
            printf 'M1_M8_OUTPUT_TEST_BLOB=%s\n' "$m1_m8_output_test_blob"
            printf 'M6_M8_SCOPED_REVIEW_STATUS=%s\n' "$m6_m8_review_status"
            printf 'M6_M8_SCOPED_REVIEW_M6_CONTRACT_SHA=%s\n' "$m6_m8_review_m6_contract_sha"
            printf 'M6_M8_SCOPED_REVIEW_TARGET_SHA=%s\n' "$m6_m8_review_target_sha"
            printf 'M6_M8_SCOPED_REVIEW_COMMENT=%s\n' "$m6_m8_review_comment"
            printf 'M6_M8_SCOPED_REVIEW_ISSUE=%s\n' "$m6_m8_review_issue"
            printf 'M6_M8_SCOPED_REVIEW_SCOPE=%s\n' "$m6_m8_review_scope"
          } >> "$GITHUB_ENV"
          printf 'M1-to-M3 reviewed Hook source: %s (historical M1 review SHA %s; current M1 %s; reviewed M3 commit %s; current M3 source %s; changed reviewed files:%s; historical blobs verified; Issue #72 comment %s)\n' "$m1_m3_review_status" "$m1_m3_review_sha" "$m1_sha" "$m1_m3_review_target_sha" "$m3_sha" "${m1_m3_review_changed_files:- none}" "$m1_m3_review_comment" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'Exact source SHAs: M9=%s M1=%s M2=%s M3=%s M4=%s M5=%s M6=%s M7=%s M8=%s\n' "$m9_sha" "$m1_sha" "$m2_sha" "$m3_sha" "$m4_sha" "$m5_sha" "$m6_sha" "$m7_sha" "$m8_sha" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M1-to-M2 Issue #52: %s (historical M1 review SHA %s; current M1 %s; exact reviewed M2 %s; current M2 %s; comment %s; scope %s; boundary %s)\n' "$m1_m2_review_status" "$m1_m2_review_sha" "$m1_sha" "$m1_m2_review_target_sha" "$m2_sha" "$m1_m2_review_comment" "$m1_m2_review_scope" "$m1_m2_review_condition" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M1-to-M3 Hook disposition: %s (reviewed M3 %s; current M3 %s; changed reviewed files:%s; historical blobs verified; Issue #72 comment %s)\n' "$m1_m3_review_status" "$m1_m3_review_target_sha" "$m3_sha" "${m1_m3_review_changed_files:- none}" "$m1_m3_review_comment" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M1-to-M8 Hook disposition: %s (reviewed source %s; exact Hook/output-test blobs unchanged at current candidate %s; Issue #%s comment %s)\n' "$m1_m8_hook_review_status" "$m1_m8_hook_review_source_sha" "$m8_candidate_sha" "$m1_m8_hook_review_issue" "$m1_m8_hook_review_comment" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M6-to-M8 scoped disposition: %s (reviewed M6 contract %s; current M6 %s; exact reviewed M8 %s; current M8 %s; Issue #59 comment %s)\n' "$m6_m8_review_status" "$m6_m8_review_m6_contract_sha" "$m6_sha" "$m6_m8_review_target_sha" "$m8_sha" "$m6_m8_review_comment" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'M6-to-M8 current lifecycle disposition: %s (manifest target %s; reviewed SHA %s; candidate test blob fingerprint %s; Issue #%s comment %s; no product E4 acceptance implied)\n' "$m6_m8_current_lifecycle_review_status" "$m6_m8_current_lifecycle_review_sha" "${m6_m8_current_lifecycle_reviewed_sha:-none}" "$m6_m8_current_lifecycle_review_blob" "$m6_m8_current_lifecycle_review_issue" "${m6_m8_current_lifecycle_review_comment:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'Current M8 PR candidate: %s (exact source pinned for M9 checks; owner dispositions are file-scoped and do not establish product E4 or host/VM acceptance)\n' "$m8_candidate_sha" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always() && steps.source-manifest.outcome == 'success'
        with:
          node-version: 22

      - name: Validate M9 exact-source manifest and workflow contract
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m9
        run: node --test test/m9-exact-source-workflow.test.mjs

      - name: Install M9 test loader
        if: always() && steps.source-manifest.outcome == 'success'
        run: npm ci
        working-directory: module-sources/m9

      - name: Install M1 owner dependencies
        if: always() && steps.source-manifest.outcome == 'success'
        run: npm ci
        working-directory: module-sources/m1

      - name: Run exact M1 held-Gateway boundary regression
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m1
        run: |
          npm run build
          node --import tsx --test test/gateway.test.ts

      - name: Install M2 exact-candidate dependencies
        if: always() && steps.source-manifest.outcome == 'success'
        run: npm ci
        working-directory: module-sources/m2

      - name: Build M2 exact package candidate
        if: always() && steps.source-manifest.outcome == 'success'
        run: npm run build
        working-directory: module-sources/m2

      - name: Run exact M7 package-smoke contract against the M2 candidate
        if: always() && steps.source-manifest.outcome == 'success'
        shell: bash
        working-directory: module-sources/m7
        run: |
          m7_sha="$(git rev-parse --verify HEAD)"
          test "$m7_sha" = "$M7_SHA"
          npm ci
          PACKAGE_ROOT="$GITHUB_WORKSPACE/module-sources/m2"
          npm run pack:check -- --package-root "$PACKAGE_ROOT"
          printf 'M7 integration source SHA: %s\nM2 package candidate SHA: %s\nRan M7 pack:check; the M2 CI package-policy pin is separately checked by the composition regression.\n' \
            "$m7_sha" "$M2_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run exact M7 installer-receipt telemetry regressions
        if: always() && steps.source-manifest.outcome == 'success'
        shell: bash
        working-directory: module-sources/m7
        run: |
          m7_sha="$(git rev-parse --verify HEAD)"
          test "$m7_sha" = "$M7_SHA"
          node --import tsx --test --test-name-pattern="Windows lifecycle smoke is isolated, same-run, checksum-bound, and limited" test/reliability.test.mjs
          node --test --test-name-pattern="Windows payload build copies every local worker module dependency|record-install keeps normal behavior when M7 phase telemetry is disabled|record-install emits only the final fixed marker when the exact M7 toggle is enabled|record-install does not enable M7 phase telemetry for non-exact toggle values" packaging/windows/test-worker.mjs

      - name: Pack M2 facade artifact for M3 fixed-host composition
        if: always() && steps.source-manifest.outcome == 'success'
        shell: bash
        working-directory: module-sources/m2
        run: |
          pack_dir="$RUNNER_TEMP/m9-m2-packed"
          consumer_root="$RUNNER_TEMP/m9-m2-consumer"
          mkdir -p "$pack_dir" "$consumer_root"
          filename="$(npm pack --json --pack-destination "$pack_dir" | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk);process.stdin.on("end",()=>process.stdout.write(JSON.parse(input)[0].filename))')"
          npm install --prefix "$consumer_root" --ignore-scripts --no-audit --no-fund "$pack_dir/$filename"
          printf 'M2_PACKED_ROOT=%s/node_modules/@dorianchn/agent-canary\n' "$consumer_root" >> "$GITHUB_ENV"
          printf 'M2_CONSUMER_ROOT=%s\n' "$consumer_root" >> "$GITHUB_ENV"
          printf 'M2 packed candidate artifact: %s\n' "$filename" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install M3 owner dependencies
        if: always() && steps.source-manifest.outcome == 'success'
        run: npm ci
        working-directory: module-sources/m3

      - name: Install M5 owner dependencies
        if: always() && steps.source-manifest.outcome == 'success'
        run: npm ci
        working-directory: module-sources/m5

      - name: Run M3 exact-source build and focused onboarding regressions
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m3
        run: |
          npm run build
          node --import tsx --test test/onboarding.test.ts test/codex-connection-check.test.ts test/agent-hook.test.ts test/security-center-route-m3.test.ts

      - name: Install M4 owner dependencies
        if: always() && steps.source-manifest.outcome == 'success'
        run: npm ci
        working-directory: module-sources/m4

      - name: Run exact M4 security-center build and focused desktop regressions
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m4
        run: |
          npm run build
          node --import tsx --test test/runtime-console.test.ts

      - name: Run exact M5 risk-policy regression
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m5
        run: |
          npm run build
          node --import tsx --test test/risk-policy.test.ts test/policy-router-export.test.ts test/policy-management.test.ts

      - name: Run M3 adapter regressions in the exact coordinated M5 candidate
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m5
        run: node --import tsx --test test/codex-connection-check.test.ts

      - name: Run exact M5-source M3 packaged owner-consumer contract
        if: always() && steps.source-manifest.outcome == 'success'
        shell: pwsh
        working-directory: module-sources/m5
        env:
          M1_ROOT: ${{ github.workspace }}/module-sources/m1
          M2_PACKED_ROOT: ${{ runner.temp }}/m9-m2-consumer/node_modules/@dorianchn/agent-canary
          M3_ROOT: ${{ github.workspace }}/module-sources/m5
          M5_ROOT: ${{ github.workspace }}/module-sources/m5
        run: |
          if ($env:RUNNER_OS -eq 'Windows') {
            $nativeTar = Join-Path $env:WINDIR 'System32\tar.exe'
            if (-not (Test-Path $nativeTar)) { throw 'Windows-native tar.exe is required for the packaged consumer test.' }
            $env:PATH = "$(Split-Path $nativeTar);$env:PATH"
            $resolvedTar = (Get-Command tar -CommandType Application | Select-Object -First 1).Source
            if ($resolvedTar -ine $nativeTar) { throw "Expected Windows-native tar.exe first on PATH, got $resolvedTar" }
          }
          node --test test/packaged-owner-consumer.test.mjs

      - name: Run M6 exact-source bundle verification regression
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m6
        run: node --test security-lab/e4/verify-bundle.test.mjs

      - name: Run M6 exact-source Auto E4 lifecycle regression
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m6
        run: node --test test/auto-e4.test.mjs

      - name: Run M7 exact-head package-contract and positive-control regressions
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m7
        run: node --test --test-name-pattern="Community candidate stages the exact M8 offline-demo Git blob and provenance|Community candidate pins the Hook Git blob when a Windows worktree has CRLF|prepare output and build instructions pass the pinned ZIP and required source commit SHA|Windows payload E4 checks the co-located privacy-safe hook wrapper|silent receipt failure chooses a safe default then still rolls back and aborts" test/windows-packaging.test.mjs

      - name: Run complete exact M7 Windows packaging tests
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m7
        run: node --test test/windows-packaging.test.mjs

      - name: Run historical M8 provenance and scoped M6-review regressions
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m8
        run: |
          node --test --test-name-pattern="prepare build command carries the same Community ZIP and exact Hook source commit in documented argument order|Windows Hook provenance keeps LF checkout bytes equal to the tracked blob" test/windows-packaging.test.mjs
          node --test --test-name-pattern="co-located E4 payload wrapper logs only allowlisted metadata" test/auto-e4.test.mjs

      - name: Run current M8 PR #40 Hook output regression
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m8-candidate
        run: node --test security-lab/claude-native-hook-output.test.mjs

      - name: Run M7/M8 exact offline Community source composition gate
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m9
        env:
          M7_ROOT: ${{ github.workspace }}/module-sources/m7
          M7_SHA: ${{ steps.source-manifest.outputs.m7 }}
          M8_CANDIDATE_ROOT: ${{ github.workspace }}/module-sources/m8-candidate
          M8_CANDIDATE_SHA: ${{ steps.source-manifest.outputs.m8 }}
        run: node --test test/m9-community-offline-composition.test.mjs

      - name: Run exact-source M1/M2/M3/M4/M5/M6/M7/M8 M9 composition regressions
        if: always() && steps.source-manifest.outcome == 'success'
        working-directory: module-sources/m9
        env:
          M9_ROOT: ${{ github.workspace }}/module-sources/m9
          M1_ROOT: ${{ github.workspace }}/module-sources/m1
          M2_ROOT: ${{ github.workspace }}/module-sources/m2
          M3_ROOT: ${{ github.workspace }}/module-sources/m3
          M4_ROOT: ${{ github.workspace }}/module-sources/m4
          M5_ROOT: ${{ github.workspace }}/module-sources/m5
          M6_ROOT: ${{ github.workspace }}/module-sources/m6
          M7_ROOT: ${{ github.workspace }}/module-sources/m7
          M8_ROOT: ${{ github.workspace }}/module-sources/m8
          M8_CANDIDATE_ROOT: ${{ github.workspace }}/module-sources/m8-candidate
          M9_SHA: ${{ steps.m9-ref.outputs.sha }}
          M1_SHA: ${{ steps.source-manifest.outputs.m1 }}
          M2_SHA: ${{ steps.source-manifest.outputs.m2 }}
          M3_SHA: ${{ steps.source-manifest.outputs.m3 }}
          M4_SHA: ${{ steps.source-manifest.outputs.m4 }}
          M5_SHA: ${{ steps.source-manifest.outputs.m5 }}
          M6_SHA: ${{ steps.source-manifest.outputs.m6 }}
          M7_SHA: ${{ steps.source-manifest.outputs.m7 }}
          M8_SHA: ${{ steps.source-manifest.outputs.m8_history }}
          M8_CANDIDATE_SHA: ${{ steps.source-manifest.outputs.m8 }}
          M6_M8_CURRENT_LIFECYCLE_REVIEW_STATUS: ${{ steps.source-manifest.outputs.m6_review_status }}
          M6_M8_CURRENT_LIFECYCLE_REVIEW_SHA: ${{ steps.source-manifest.outputs.m6_review_target_sha }}
          M6_M8_CURRENT_LIFECYCLE_REVIEWED_SHA: ${{ steps.source-manifest.outputs.m6_reviewed_sha }}
          M6_M8_CURRENT_LIFECYCLE_REVIEW_BLOB: ${{ steps.source-manifest.outputs.m6_review_test_blob }}
          M6_M8_CURRENT_LIFECYCLE_REVIEW_COMMENT: ${{ steps.source-manifest.outputs.m6_review_comment_id }}
          M6_M8_CURRENT_LIFECYCLE_REVIEW_ISSUE: ${{ steps.source-manifest.outputs.m6_review_issue }}
          M6_M8_CURRENT_LIFECYCLE_REVIEW_VERIFIER_BLOB: ${{ steps.source-manifest.outputs.m6_review_verifier_test_blob }}
          M2_PACKED_ROOT: ${{ runner.temp }}/m9-m2-consumer/node_modules/@dorianchn/agent-canary
          M2_CONSUMER_ROOT: ${{ runner.temp }}/m9-m2-consumer
        run: node --import tsx --test test/m9-cross-module-composition.test.mjs

      - name: Enforce exact M6 disposition for the current M8 lifecycle candidate
        if: always() && steps.source-manifest.outcome == 'success'
        shell: bash
        env:
          RECORD_SOURCE_OUTCOME: ${{ steps.record-sources.outcome }}
        run: |
          candidate_sha="$(git -C module-sources/m8-candidate rev-parse --verify HEAD)"
          m6_candidate_sha="$(git -C module-sources/m6 rev-parse --verify HEAD)"
          m8_lifecycle_blob="$(git -C module-sources/m8-candidate rev-parse --verify "${candidate_sha}:test/auto-e4.test.mjs")"
          m6_lifecycle_blob="$(git -C module-sources/m6 rev-parse --verify "${m6_candidate_sha}:test/auto-e4.test.mjs")"
          m6_verifier_blob="$(git -C module-sources/m6 rev-parse --verify "${m6_candidate_sha}:security-lab/e4/verify-bundle.test.mjs")"
          failures=0
          if [[ "$RECORD_SOURCE_OUTCOME" != 'success' ]]; then
            echo "Checked-out source/provenance record failed: $RECORD_SOURCE_OUTCOME" >&2
            failures=1
          fi
          if [[ "$M6_M8_CURRENT_LIFECYCLE_REVIEW_STATUS" != 'ACCEPT' ]]; then
            echo "M6 must explicitly ACCEPT the exact current M8 lifecycle candidate; got $M6_M8_CURRENT_LIFECYCLE_REVIEW_STATUS" >&2
            failures=1
          fi
          if [[ "$M6_M8_CURRENT_LIFECYCLE_REVIEW_ISSUE" != '80' ]]; then
            echo 'M6 lifecycle acceptance must be recorded on Issue #80.' >&2
            failures=1
          fi
          if [[ "$M6_M8_CURRENT_LIFECYCLE_REVIEW_SHA" != "$M8_CANDIDATE_SHA" || "$candidate_sha" != "$M8_CANDIDATE_SHA" ]]; then
            echo 'M6 lifecycle disposition and checked-out M8 candidate must name the same exact SHA.' >&2
            failures=1
          fi
          if [[ "$M6_M8_CURRENT_LIFECYCLE_REVIEWED_SHA" != "$M8_CANDIDATE_SHA" || ! "$M6_M8_CURRENT_LIFECYCLE_REVIEW_COMMENT" =~ ^[0-9]+$ ]]; then
            echo 'M6 ACCEPT must cite the exact current M8 SHA and a numeric owner-comment ID.' >&2
            failures=1
          fi
          if [[ ! "$M6_M8_CURRENT_LIFECYCLE_REVIEW_BLOB" =~ ^[a-f0-9]{40}$ || "$m8_lifecycle_blob" != "$M6_M8_CURRENT_LIFECYCLE_REVIEW_BLOB" || "$m6_lifecycle_blob" != "$M6_M8_CURRENT_LIFECYCLE_REVIEW_BLOB" ]]; then
            echo 'M6/M8 lifecycle test blobs differ from the exact owner-reviewed manifest fingerprint.' >&2
            failures=1
          fi
          if [[ ! "$M6_M8_CURRENT_LIFECYCLE_REVIEW_VERIFIER_BLOB" =~ ^[a-f0-9]{40}$ || "$m6_verifier_blob" != "$M6_M8_CURRENT_LIFECYCLE_REVIEW_VERIFIER_BLOB" ]]; then
            echo 'M6 verifier test blob differs from the exact owner-reviewed manifest fingerprint.' >&2
            failures=1
          fi
          printf 'M6 current-head lifecycle disposition: %s; M6=%s; M8=%s; reviewed=%s; comment=%s; lifecycleBlob=%s; verifierBlob=%s\n' \
            "$M6_M8_CURRENT_LIFECYCLE_REVIEW_STATUS" "$M6_SHA" "$M8_CANDIDATE_SHA" \
            "${M6_M8_CURRENT_LIFECYCLE_REVIEWED_SHA:-none}" \
            "${M6_M8_CURRENT_LIFECYCLE_REVIEW_COMMENT:-none}" "$m8_lifecycle_blob" "$m6_verifier_blob" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failures"

      - name: Record evidence limits
        if: always()
        shell: bash
        run: |
          {
            echo 'Current immutable candidates are loaded from docs/3.0/M9_EXACT_SOURCE_REFS.json; the exact M1-M8 and M9 commits are printed above. No candidate SHA is inferred from a mutable PR head.'
            echo 'M8 checkout 84ee6a7a8d65706f694b7949e82fd8c83cc11523 is a historical source retained only for the narrowly scoped M6-reviewed test regression; it is not a current M8 candidate or a PASS verdict.'
            echo "M8 current PR candidate $M8_CANDIDATE_SHA is checked separately, including its offline-demo Guard rejection source; M7 Community candidate blob compatibility and the exact 37-file runtime/sdk.d.ts contract are blocking M9 gates."
            echo 'Open module candidates are tracked separately from merged refs. This workflow does not convert pending owner checks into acceptance.'
            echo 'Composition assertions are synthetic source/package fixtures only; they do not establish first-party product-host wiring, real protected-file access, OS-atomic TOCTOU, clean-VM installer lifecycle, or independent product E4.'
            echo 'Issue #52 remains OPEN / P0 / NOT_VERIFIED for supported product-host held-identity consumption and TOCTOU. Issue #57 and independent product E4 remain NOT_VERIFIED.'
          } >> "$GITHUB_STEP_SUMMARY"
