name: Publish Agent Canary 3.0 packages

on:
  push:
    tags: ["v3.0.0"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@dorianchn"
      - name: Verify release identity
        run: |
          node -e 'const p=require("./package.json"); if (p.version !== "3.0.0" || p.private) process.exit(1);'
          test "$GITHUB_REF_NAME" = "v3.0.0"
      - run: npm ci
      - run: npm run verify
      - name: Publish npm package to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Docker image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull -t "$image:3.0.0" -t "$image:latest" .
          docker push "$image:3.0.0"
          docker push "$image:latest"
