<p class="tag">AGENT CANARY 2.x · MIT · FREE</p>
<h1>旧版付款与许可证流程已停用</h1>
<p>Agent Canary 2.x 的所有软件功能现已免费开源。使用评测、攻击链面板、SIEM 导出或 SDK 无需付款、提交邮箱、输入激活码或连接许可证服务器。</p>
<p>如果你保存了旧版付款页或二维码，请不要再用它们购买或提交付款信息。旧版 activate 命令只为兼容保留，不会联网。</p>
<p>如你此前已购买 Agent Canary，无需重新激活即可使用公开版本中的全部功能。</p>
<p><a href="https://github.com/DorianChn/shanchuanzhi-agent-canary">打开 GitHub 源码</a> · <a href="https://github.com/DorianChn/shanchuanzhi-agent-canary/blob/main/README.zh-CN.md">阅读使用指南</a> · <a href="https://github.com/DorianChn/shanchuanzhi-agent-canary/discussions">项目讨论</a></p>
</main>
